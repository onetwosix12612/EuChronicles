<title>Хроники Европы</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@500;700&family=Alegreya+Sans:wght@400;500;700&display=swap">
<style>
/* Layout: one-screen war table. Header strip, framed map, context sheet, tab bar. */
:root{
  --sea:#0d1a24; --bg:#11171e; --panel:#19212a; --panel2:#222c37; --line:#34424f;
  --ink:#e8e2d2; --mute:#9aa7b3; --brass:#d9b45b; --brassd:#8b6f2e;
  --bad:#d8594d; --good:#62b177; --warn:#e2a840; --neutral:#3b4148;
  --f-display:'Alegreya SC',Georgia,'Times New Roman',serif;
  --f-ui:'Alegreya Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.35;
  padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow:hidden}
*{box-sizing:border-box}
[hidden]{display:none!important}
button{font:inherit;color:inherit}
#app{height:100%;display:flex;flex-direction:column;gap:8px;max-width:1000px;margin:0 auto;padding-block:8px}
small{color:var(--mute);letter-spacing:.06em;text-transform:uppercase;font-size:11px}
b{font-weight:700}
.num{font-variant-numeric:tabular-nums}
#top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
#top .st{display:flex;flex-direction:column;min-width:0;line-height:1.1}
#top .st b{font-family:var(--f-display);font-size:20px;white-space:nowrap}
#top .st i{font-style:normal;font-size:12px;color:var(--mute)}
#top .st i.pos{color:var(--good)} #top .st i.neg{color:var(--bad)}
#endturn{margin-left:auto}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 12px;cursor:pointer;min-height:40px}
.btn:hover{border-color:var(--brassd)}
.btn:disabled{opacity:.4;cursor:default}
.btn.primary{background:var(--brass);color:#1b1608;border-color:var(--brass);font-weight:700}
.btn.danger{border-color:#7b3731;color:#ffb3aa}
.btn.small{padding:5px 9px;min-height:32px;font-size:14px}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
#views{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px}
.view{flex:1;min-height:0;display:none;flex-direction:column;gap:8px}
.view.on{display:flex}
#mapwrap{position:relative;flex:1;min-height:200px;background:var(--sea);border:1px solid var(--line);border-radius:10px;overflow:hidden;touch-action:none}
#map{position:absolute;inset:0;width:100%;height:100%;display:block;user-select:none;-webkit-user-select:none}
#map.geo1 .geolbl,#map.geo2 .geolbl,#map.geo2 #geo{display:none!important}
#zoom button.off{opacity:.55}
#map .geolbl{display:none}#map.showgeo .geolbl{display:block}
.gt{font-family:var(--f-ui);fill:#e6eef3;paint-order:stroke;stroke:#0b1218;stroke-opacity:.75;stroke-linejoin:round;font-size:calc(11px*var(--k));stroke-width:calc(2.6px*var(--k))}
.gt.rv{font-style:italic;font-weight:600;fill:#bfe0f5}.gt.mt{font-size:calc(9.5px*var(--k));letter-spacing:.32em;font-weight:700;fill:#dfe3e6;opacity:.9}.gt.lk{font-style:italic;fill:#cfe8f7;font-size:calc(10px*var(--k))}
#map .lb{display:none}#map.showlbl .lb{display:block}
#zoom{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:6px}
#zoom button{width:38px;height:38px;border-radius:8px;border:1px solid var(--line);background:rgba(17,23,30,.88);font-size:20px;cursor:pointer}
#adv{position:absolute;left:8px;top:8px;height:34px;padding:0 14px;border-radius:17px;border:1px solid var(--gold,#c9a54a);background:rgba(17,23,30,.9);color:var(--gold,#c9a54a);font:600 14px "Alegreya Sans",sans-serif;cursor:pointer}
.news{padding-left:0;list-style:none;margin:8px 0}.news li{padding:6px 0;border-bottom:1px solid var(--line);font-size:15px;line-height:1.35}.news li svg{vertical-align:-2px;margin-right:4px}
.adv{padding:8px 0;border-bottom:1px solid var(--line)}.adv p{margin:3px 0 6px;font-size:14px;color:var(--mute)}
#menu{position:absolute;left:100px;top:8px;height:34px;padding:0 14px;border-radius:17px;border:1px solid var(--line);background:rgba(17,23,30,.9);color:var(--ink,#e8e2d2);font:600 14px "Alegreya Sans",sans-serif;cursor:pointer}
.ico{flex:none;vertical-align:middle;display:inline-block}
.unit.ic{flex-direction:row;align-items:center;gap:9px}.unit.ic .it{display:flex;flex-direction:column;gap:1px;min-width:0;text-align:left}
.achips{display:flex;flex-wrap:wrap;gap:5px;margin:4px 0}.ach{display:inline-flex;align-items:center;gap:5px;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:2px 9px 2px 2px;font-size:15px}
.tcard.tc{display:flex;gap:10px;align-items:flex-start}
.evh{display:flex;align-items:center;gap:10px;margin:2px 0 6px}.evh h2{margin:0}
.bchip{display:inline-flex;align-items:center;gap:5px}
.dship{animation:bob 4.5s ease-in-out infinite;transform-box:fill-box}
@keyframes bob{0%,100%{translate:0 0}50%{translate:0 -2px}}
@media (prefers-reduced-motion:reduce){.dship{animation:none}}
#hint{position:absolute;left:8px;bottom:8px;right:60px;font-size:13px;color:var(--mute);background:rgba(17,23,30,.82);padding:5px 9px;border-radius:8px;pointer-events:none}
.cell{stroke:#0d1a24;stroke-width:1px;vector-effect:non-scaling-stroke;cursor:pointer}
.hl{fill:none;vector-effect:non-scaling-stroke;pointer-events:none}
.hl.reach{stroke:#fff;stroke-width:2.2px;stroke-dasharray:5 4}
.hl.sel{stroke:var(--brass);stroke-width:3.4px}
.plain{fill:#3f453f;stroke:#0d1a24;stroke-width:1px;vector-effect:non-scaling-stroke}
.mk{pointer-events:none}
.mk text{font-family:var(--f-ui);fill:#f3efe2;paint-order:stroke;stroke:#0b1218;stroke-width:3px;stroke-linejoin:round}
.lbl{font-size:13px;font-weight:700;text-anchor:middle}
.cnt{font-size:11px;font-weight:700;text-anchor:middle}
.sk{pointer-events:none}.sk text{font-family:var(--f-display);font-size:12px;fill:#35566d;letter-spacing:.3em;text-anchor:middle}
#sheet{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;max-height:40%;overflow:auto;flex-shrink:0}
#sheet h3{margin:0;font-family:var(--f-display);font-size:22px;font-weight:700;line-height:1.1}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.sp{justify-content:space-between}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--mute)}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block;border:1px solid rgba(255,255,255,.35);flex-shrink:0}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:6px 12px;margin:10px 0}
.kv div{min-width:0}
.kv b{display:block;font-size:16px}
.bar{height:6px;background:#0d141b;border-radius:3px;overflow:hidden;margin-top:3px}
.bar i{display:block;height:100%;background:var(--good)}
.sec{margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.sec>small{display:block;margin-bottom:6px}
.btns{display:flex;gap:6px;flex-wrap:wrap}
.unit{display:flex;flex-direction:column;align-items:flex-start;text-align:left;gap:1px;flex:1 1 100px;min-width:0}
.unit span{font-size:12px;color:var(--mute)}
.odds{font-weight:700}
.odds.hi{color:var(--good)} .odds.mid{color:var(--warn)} .odds.lo{color:var(--bad)}
#tabs{display:flex;gap:6px}
#tabs button{flex:1;min-width:0;position:relative;padding:9px 2px;border-radius:8px;background:var(--panel);border:1px solid var(--line);cursor:pointer;font-family:var(--f-display);font-size:14px;letter-spacing:.02em}
#tabs button.idle::after{content:'';position:absolute;top:5px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--brass)}
#tabs button.on.idle::after{background:#1b1608}
#tabs button.on{background:var(--brass);color:#1b1608;border-color:var(--brass)}
.page{flex:1;min-height:0;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
.page h2{font-family:var(--f-display);font-size:20px;margin:0 0 8px}
.page h2:not(:first-child){margin-top:18px}
.page p{margin:6px 0;max-width:65ch}
.fac{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;padding:10px 0;border-bottom:1px solid var(--line)}
.fac .nm{font-weight:700}
.fac .act{grid-column:1 / -1}
.tax{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tax .btn.on{background:var(--brass);color:#1b1608;border-color:var(--brass)}
.log li{padding:6px 0;border-bottom:1px solid var(--line);list-style:none}
.log{padding:0;margin:0}
.log .yr{color:var(--mute);font-size:12px;margin-right:6px}
.log .w{color:var(--bad)} .log .g{color:var(--good)} .log .i{color:var(--brass)}
#modal{position:fixed;inset:0;background:rgba(5,9,13,.78);display:flex;align-items:flex-start;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) 16px max(16px,env(safe-area-inset-bottom,0px));overflow:auto;z-index:10}
#modal .card{background:var(--panel);border:1px solid var(--brassd);border-radius:12px;padding:18px;width:100%;max-width:620px;margin:auto}
#modal h2{font-family:var(--f-display);font-size:26px;margin:0 0 6px;line-height:1.1}
#modal p{margin:6px 0}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px;margin-top:12px}
.fcard{text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px;cursor:pointer;display:flex;flex-direction:column;gap:3px;min-width:0}
.fcard:hover{border-color:var(--brass)}
.fcard b{font-family:var(--f-display);font-size:18px}
.fcard span{font-size:13px;color:var(--mute)}
.fcard em{font-style:normal;font-size:12px;color:var(--brass)}
.rep{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.rep>div{background:var(--panel2);border-radius:8px;padding:10px;min-width:0}
.rep h4{margin:0 0 4px;font-size:15px}
.rep .win{outline:2px solid var(--good)}
.rep li{list-style:none;font-size:13px;color:var(--mute)}
.rep ul{margin:4px 0 0;padding:0}
.help-u{display:grid;grid-template-columns:1fr;gap:4px}
.cicon{flex-shrink:0;display:block}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}
.seg button{padding:7px 4px;border-radius:8px;background:var(--panel2);border:1px solid var(--line);cursor:pointer;font-family:var(--f-display);font-size:15px}
.seg button.on{background:var(--brass);color:#1b1608;border-color:var(--brass)}
.slots{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.bchip{padding:4px 9px;border-radius:6px;background:var(--panel2);border:1px solid var(--brassd);font-size:13px}
.bchip.q{border-style:dashed;color:var(--brass)}
.bchip.e{border:1px dashed var(--line);color:var(--mute);background:transparent}
.blist{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.blist .unit{flex:none}
.ugrid{grid-template-columns:repeat(auto-fill,minmax(215px,1fr))}.blist .unit.ic{width:100%}
.grow{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 8px;margin-top:6px;cursor:pointer;min-width:0}
.grow:hover{border-color:var(--brassd)}
.grow>span{min-width:0}
.port{flex-shrink:0;border-radius:8px;display:block}
.crest{display:inline-block;vertical-align:-3px;flex-shrink:0;margin-right:4px}
.fcard b{display:flex;align-items:center;gap:6px}
.mut{display:block;color:var(--mute);font-size:13px;margin:3px 0}
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.tgrid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.tcard{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px;min-width:0}
.tcard.uniq{border-color:var(--brassd)}
.tcard.done{opacity:.7}
.tcard.cur{border-color:var(--brass);margin-bottom:8px}
.tact.on{border-color:var(--brass);background:#2b3441}
.bt-bars{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
#field{display:block;border-radius:10px}
#field .u{transition:opacity .5s,transform .5s;transform-box:fill-box;transform-origin:center}
#field .u.dead{opacity:.1;transform:translateY(3px) scale(.8)}
@keyframes swing{0%,100%{transform:translateX(0)}50%{transform:translateX(2.5px)}}
@media (prefers-reduced-motion:no-preference){#field .u.swing{animation:swing .3s ease-in-out 2}}
@media (min-width:760px){#mapwrap{min-height:380px}#sheet{max-height:34%}}
@media (prefers-reduced-motion:no-preference){.hl.reach{animation:dash 1.4s linear infinite}@keyframes dash{to{stroke-dashoffset:-18}}}

</div>

function mulberry(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function terr(lon,lat,lm,r){
  if(lm==='afri')return lat<34.3?'sand':(lat<35.6&&lon<9?'mount':'none');
  if(lm==='anat')return lat<38.3?'mount':(lon>30?'steppe':'none');
  if(lon>5&&lon<16&&lat>45.6&&lat<47.9)return 'mount';
  if(lon>-2&&lon<3&&lat>42&&lat<43.3)return 'mount';
  if(lon>19&&lon<27&&lat>46.3&&lat<49.2)return 'mount';
  if(lm==='scan'&&lon<13&&lat>58.8)return 'mount';
  if(lm==='brit'&&lat>56)return 'mount';
  if(lm==='main'&&lon>10&&lon<15&&lat>41.5&&lat<44.5)return 'mount';
  if(lm==='main'&&lon>16&&lon<23&&lat>41.5&&lat<44.5)return 'mount';
  if(lm==='main'&&lon>40&&lat<45)return 'mount';
  if(lm==='main'&&lon>32.5&&lat<51)return 'steppe';
  if(lat>47.5)return 'forest';
  if(lat>43.5)return r<.4?'forest':'none';
  return r<.25?'forest':'none';
}

function buildGeo(){
  const pts=PR.map(p=>proj(p[2],p[3]));
  const del=d3.Delaunay.from(pts);
  const vor=del.voronoi([0,0,W,H]);
  const idx={};PR.forEach((p,i)=>idx[p[0]]=i);
  const adj=PR.map(()=>new Set());
  for(let i=0;i<PR.length;i++){
    for(const j of del.neighbors(i)){
      if(j<=i)continue;
      const a=pts[i],b=pts[j];
      if(Math.hypot(a[0]-b[0],a[1]-b[1])>190)continue;
      let ok=true;
      for(let s=1;s<14;s++){const t=s/14;if(!landOf([a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t])){ok=false;break}}
      if(ok){adj[i].add(j);adj[j].add(i)}
    }
  }
  const sea=[];
  const link=(i,j)=>{if(!adj[i].has(j)){adj[i].add(j);adj[j].add(i);sea.push([i,j])}};
  for(const [x,y] of SEA_LINKS){const i=idx[x],j=idx[y];if(i!==undefined&&j!==undefined)link(i,j)}
  for(let g=0;g<20;g++){
    const seen=new Set([0]),q=[0];
    while(q.length){const c=q.pop();adj[c].forEach(j=>{if(!seen.has(j)){seen.add(j);q.push(j)}})}
    if(seen.size===PR.length)break;
    let best=null,bd=1e9;
    for(const i of seen)for(let j=0;j<PR.length;j++){if(seen.has(j))continue;const d=Math.hypot(pts[i][0]-pts[j][0],pts[i][1]-pts[j][1]);if(d<bd){bd=d;best=[i,j]}}
    link(best[0],best[1]);
  }
  const lm=pts.map(landOf);
  const tr=PR.map((p,i)=>{const t=terr(p[2],p[3],lm[i],mulberry(i*977+13)());return t==='none'?'plain':t});
  GEO={pts,idx,adj:adj.map(s=>[...s]),sea,cells:PR.map((_,i)=>vor.renderCell(i)),lm,terr:tr};
  return GEO;
}

function segX(a,b,c,d){
  const o=(p,q,r)=>(q[0]-p[0])*(r[1]-p[1])-(q[1]-p[1])*(r[0]-p[0]);
  return o(a,b,c)*o(a,b,d)<0&&o(c,d,a)*o(c,d,b)<0;
}
function polyHit(a,b,poly){for(let i=1;i<poly.length;i++)if(segX(a,b,poly[i-1],poly[i]))return true;return false}

function own(f){const r=[];S.prov.forEach((p,i)=>{if(p.o===f)r.push(i)});return r}
function alive(f){return S.prov.some(p=>p.o===f)}

/* --- эффекты исследований --- */
function getFx(f){
  if(!f||f==='n'||!S)return FX0;
  if(FXC[f])return FXC[f];
  const fx={...FX0};
  ((S.res&&S.res.done[f])||[]).forEach(id=>{const e=TECH[id].e;for(const k in e)fx[k]=(fx[k]||0)+e[k]});
  rulerFx(f,fx);cfFx(f,fx);
  if(S.zeal&&S.zeal[f]>0){fx.all+=.08;fx.loy+=4}
  return FXC[f]=fx;
}
const T1={spear:1,bow:1,knight:1};
/* --- сила и бой --- */
function cp(u){const n={spear:0,bow:0,knight:0},w={spear:0,bow:0,knight:0};UK.forEach(k=>{const c=u[k]||0;if(c){n[U[k].cls]+=c;w[U[k].cls]+=c*U[k].atk}});return {n,w}}
function power(u,e,bonus,f,tm,tk){
  const fx=getFx(f);tm=tm||T1;
  const A=cp(u).w,ml=u.mil||0,B=cp(e).n;
  const E=(B.spear+B.bow+B.knight+(e.mil||0))||1;
  const sk=(B.spear+(e.mil||0))/E,bk=B.bow/E,kn=B.knight/E;
  const all=1+fx.all;
  const a=(A.spear*(1+fx.spear)*tm.spear+ml*6)*(1+.6*kn-.4*bk)*all;
  const b=A.bow*(1+fx.bow)*tm.bow*(1+.6*sk-.4*kn)*all;
  const c=A.knight*(1+fx.knight)*tm.knight*(tk||1)*(1+.6*bk-.4*sk)*all;
  return (a+b+c)*(bonus||1);
}
function rawPower(u){let t=0;for(const k of UK)t+=(u[k]||0)*U[k].atk;return t}
function strength(f){let t=0;S.prov.forEach(p=>{if(p.o===f&&p.army)t+=rawPower(p.army.u)});return t}
function defUnits(to){const p=S.prov[to];const u=p.army?{...p.army.u}:zeroU();u.mil=p.g;return u}
function defBonus(to,from){const f=S.prov[to].o,sg=S.prov[to].siege,t=sg?sg.t:0;return (S.dyn&&S.dyn[f]&&S.dyn[f].regency>0?-.1:0)+1+.08*S.prov[to].lvl+(isCap(to)?.1:0)+(has(to,'walls')&&t<2?.2:0)+getFx(f).def-Math.min(.25,.06*t)+geoDef(from,to)}
function terrOf(to){return TER[GEO.terr[to]]||TER.plain}
function estimate(from,to,tact){
  const A=S.prov[from],D=S.prov[to],T=terrOf(to);
  const att={...A.army.u,mil:0},def=defUnits(to);
  const ga=leaderOf(from),gd=leaderOf(to);
  const pa=power(att,def,gPow(ga,true),A.o,tmWith(tact||'line',ga),T.k);
  const pd=power(def,att,(defBonus(to,from)+(T.def||0))*gPow(gd,false),D.o,TACT.line.m,T.k);
  return {pa,pd,ratio:pa/Math.max(pd,1)};
}
function bestTactic(from,to){let b='line',br=-1;TK.forEach(t=>{const r=estimate(from,to,t).ratio;if(r>br+.001){br=r;b=t}});return b}
function oddsLabel(r){
  if(r>=1.5)return{t:'Лёгкая победа',c:'hi'};
  if(r>=1.05)return{t:'Вероятная победа',c:'hi'};
  if(r>=.8)return{t:'Равный бой',c:'mid'};
  if(r>=.5)return{t:'Опасно, скорее поражение',c:'lo'};
  return{t:'Верное поражение',c:'lo'};
}
const HPU={mil:7};UK.forEach(k=>HPU[k]=U[k].hp);
function hpOf(u){return UK.reduce((s,k)=>s+(u[k]||0)*HPU[k],0)+(u.mil||0)*HPU.mil}
function snapU(u,mil){const r={};UK.forEach(k=>r[k]=Math.round(u[k]||0));if(mil)r.mil=Math.round(u.mil||0);return r}
function keepOne(after,before){if(usize(after)>0)return after;const k=UK.slice().reverse().find(k=>(before[k]||0)>0);if(k)after[k]=1;return after}
function simulate(from,to,tact){
  const A=S.prov[from],D=S.prov[to],T=terrOf(to);
  const ga=leaderOf(from),gd=leaderOf(to),tmA=tmWith(tact,ga);
  const a0=snapU(A.army.u),d0=snapU(D.army?D.army.u:zeroU());d0.mil=D.g;
  const ca={...a0},cd={...d0};
  const hA0=Math.max(hpOf(a0),1),hD0=Math.max(hpOf(d0),1);
  const db=defBonus(to,from)+(T.def||0);
  const rounds=[];let fra=1,frd=1;
  for(let r=1;r<=5;r++){
    const pa=power(ca,cd,gPow(ga,true),A.o,tmA,T.k)*(.85+rnd()*.3);
    const pd=power(cd,ca,db*gPow(gd,false),D.o,TACT.line.m,T.k)*(.85+rnd()*.3);
    const lA=Math.min(.95,pd*.28/Math.max(hpOf(ca),1)),lD=Math.min(.95,pa*.28/Math.max(hpOf(cd),1));
    UK.forEach(k=>{ca[k]*=1-lA;cd[k]*=1-lD});cd.mil*=1-lD;
    fra=hpOf(ca)/hA0;frd=hpOf(cd)/hD0;
    rounds.push({a:snapU(ca),d:snapU(cd,true),fra,frd});
    if(fra<.35||frd<.35)break;
  }
  const win=(frd<.35&&fra>=.35)?true:((fra<.35&&frd>=.35)?false:fra>frd);
  return {win,rounds,a0,d0,ca,cd,fra,frd,ga,gd};
}
function half(u){const r=zeroU();UK.forEach(k=>r[k]=Math.floor((u[k]||0)*.5));return r}

function canAttack(from,to){
  const a=S.prov[from],b=S.prov[to];
  return !!a.army&&!a.army.mv&&a.o!==b.o&&GEO.adj[from].includes(to)&&atWar(a.o,b.o);
}
function canMove(from,to){
  const a=S.prov[from],b=S.prov[to];

function moveArmy(from,to){
  const a=S.prov[from],b=S.prov[to];
  const lid=leaderOf(from);
  if(lid){remGen(from,lid);addGen(to,lid)}
  const u=a.army.u;a.army=null;
  if(b.army){for(const k of UK)b.army.u[k]=(b.army.u[k]||0)+(u[k]||0)}
  else b.army={u:{...u},mv:false};
  b.army.mv=true;
  let lost=0;
  if(edgeFx(from,to).m){UK.forEach(k=>{const n=b.army.u[k]||0;const l=Math.floor(n*.05);if(l>0&&n-l>=1){b.army.u[k]=n-l;lost+=l}})}
  b.army.loss=lost;
  if(isSea(from,to)&&a.o===S.player){a.ships=Math.max(0,(a.ships||0)-1);b.ships=(b.ships||0)+1}
  tlog({k:'mv',f:a.o,from,to});
}
function retreat(f,from,u){
  if(f==='n'||usize(u)===0)return -1;
  const opts=GEO.adj[from].filter(j=>S.prov[j].o===f);
  if(!opts.length)return -1;
  const j=opts.find(j=>!S.prov[j].army)??opts[0];
  const b=S.prov[j];
  if(b.army){for(const k of UK)b.army.u[k]=(b.army.u[k]||0)+(u[k]||0)}
  else b.army={u:{...u},mv:true};
  return j;
}
function gSnap(id){if(!id)return null;const g=S.gens[id],e=gEff(g);return {id,name:gFullName(g),rank:gRank(g),cmd:e.cmd,tac:e.tac,f:g.f}}
function attack(from,to,tact){
  tact=tact||'line';S.inB=1;
  const A=S.prov[from],D=S.prov[to];
  const af=A.o,df=D.o;
  const sim=simulate(from,to,tact);
  delete D.siege;if(A.army)delete A.army.sg;const seaMv=isSea(from,to)&&af===S.player;
  const ga=sim.ga,gd=sim.gd;
  const rep={from,to,af,df,win:sim.win,place:pname(to),capt:false,tactic:tact,terr:GEO.terr[to],rounds:sim.rounds,
    before:{att:sim.a0,def:snapU(sim.d0),mil:sim.d0.mil},after:{},
    genA:gSnap(ga),genD:gSnap(gd),gnotes:[]};
  const N=rep.gnotes;
  const lowOdds=sim.fra<1&&sim.frd>.9?true:false;
  if(sim.win){
    const sur=keepOne(snapU(sim.ca),sim.a0);
    const dl=half(sim.cd);
    const oldG=D.gens.slice();
    A.army=null;D.army={u:sur,mv:true};
    const rd=retreat(df,to,dl),retreated=rd>=0;
    rep.after={att:sur,def:retreated?dl:zeroU(),mil:0,retreated};
    D.o=af;D.loy=25;D.g=0;D.rec=0;D.realm='';D.q=null;rep.capt=true;
    oldG.forEach(id=>{
      remGen(to,id);
      if(retreated){addGen(rd,id);gBio(S.gens[id],'Отступил из '+pname(to)+' в '+pname(rd)+'.');if(id===gd)gXp(id,5,N)}
      else gKill(id,'погиб при защите города '+pname(to),N);
    });
    if(ga){
      remGen(from,ga);addGen(to,ga);
      const g=S.gens[ga];g.b++;g.w++;g.cap++;
      gBio(g,'Одержал победу и взял город '+pname(to)+'.');
      gXp(ga,22+(sim.fra<.6?8:0),N);
      if(g.w>=5)gTrait(ga,'veteran','Пять побед за плечами.',N);
      if(g.cap>=3)gTrait(ga,'conq','Взял уже три города.',N);
      if(sim.fra<.55&&!g.hero){g.hero=1;gTrait(ga,'hero','Победил в тяжёлом бою под городом '+pname(to)+'.',N)}
      if(rnd()<.08){gTrait(ga,'lame','Ранен при штурме '+pname(to)+'.',N)}
    }
    if(df!=='n'&&!alive(df))logm(fname(df)+' пала.','w');
  }else{
    const left=half(sim.ca);
    A.army=usize(left)>0?{u:left,mv:true}:null;
    let dAfter=zeroU();
    if(D.army){dAfter=keepOne(snapU(sim.cd),sim.d0);D.army.u=dAfter}
    D.g=Math.max(0,Math.round(sim.cd.mil));
    if(!D.army&&D.g<1)D.g=1;
    rep.after={att:left,def:dAfter,mil:D.g};
    if(ga){
      const g=S.gens[ga];g.b++;
      gBio(g,'Потерпел поражение под городом '+pname(to)+'.');
      gXp(ga,10,N);
      if(rnd()<(A.army?.07:.25))gKill(ga,'погиб в бою у города '+pname(to),N);
      else if(rnd()<.12)gTrait(ga,'lame','Тяжело ранен у '+pname(to)+'.',N);
    }
    if(gd){
      const g=S.gens[gd];g.b++;g.w++;
      gBio(g,'Отбил нападение на город '+pname(to)+'.');
      gXp(gd,18,N);
      if(g.w>=5)gTrait(gd,'veteran','Пять побед за плечами.',N);
    }
  }
  S.inB=0;
  if(sim.win)D.ships=0;
  if(seaMv){A.ships=Math.max(0,(A.ships||0)-1);if(sim.win)D.ships=1}
  tlog({k:'atk',f:af,t:df,from,to,win:sim.win});
  if(af===S.player||df===S.player){const me=S.player,st=S.st;if(af===me){if(sim.win){st.bw++;st.cap++}else st.bl++}else{if(sim.win){st.bl++;st.lost++}else st.bw++}S.pending.push(rep)}
  return rep;
}
function sack(i){

  S.gold[p.o]+=Math.round((p.lvl+1)*70*(1+getFx(p.o).sack));
  p.lvl=Math.max(0,p.lvl-1);p.loy=15;

/* --- экономика --- */
function provIncome(i){
  const p=S.prov[i];const f=p.o;
  let m=TAXN[S.tax[f]].m*(.6+.4*p.loy/100);
  if(isCap(i))m*=1.2;
  if(has(i,'market'))m*=1.3;
  const gv=govOf(i);if(gv)m*=1+.015*gEff(gv).adm;
  const al=Object.keys(FAC).filter(g=>isAlly(f,g)&&alive(g)).length;
  m*=1+.05*Math.min(al,3);
  m*=1+getFx(f).inc+.06*tradeCount(f);
  geoBuild();if(GEO.rv[i])m*=1.06;if(GEO.lk[i]!==undefined)m*=1.04;
  if(f!==S.player&&S.diff===2)m*=1.15;
  return INC[p.lvl]*m;
}
function income(f){let t=0;S.prov.forEach((p,i)=>{if(p.o===f)t+=provIncome(i)});return Math.round(t)}
function upkeep(f){let t=0;S.prov.forEach(p=>{if(p.o===f&&p.army)for(const k of UK)t+=(p.army.u[k]||0)*U[k].up});return Math.round(t*(1-getFx(f).upk))}
function net(f){return income(f)-upkeep(f)}

function ucost(f,type){const x=getFx(f);return Math.round(U[type].cost*(1-x.cost-(x['c'+U[type].cls]||0)))}
function bcost(f,id){return Math.round(BLD[id].cost*(1-getFx(f).bcost))}
function recruit(i,type){
  const p=S.prov[i],f=p.o;
  if(!unitOk(f,type))return 'Этот отряд недоступен вашей стране.';
  if(NEED[type]&&!has(i,NEED[type]))return 'Нужно здание: '+BLD[NEED[type]].n+'.';
  if(p.rec>=recCap(i))return 'В этой провинции набор на этот ход закончен.';
  const cc=ucost(f,type);
  if(S.gold[f]<cc)return 'Не хватает золота.';
  S.gold[f]-=cc;p.rec++;
  if(!p.army)p.army={u:zeroU(),mv:false};
  p.army.u[type]=(p.army.u[type]||0)+1;
  return null;
}
function addUnit(i,type,n){const p=S.prov[i];if(!p.army)p.army={u:zeroU(),mv:false};p.army.u[type]=(p.army.u[type]||0)+n}
function upgrade(i){
  const p=S.prov[i],f=p.o;
  if(p.lvl>=3)return 'Уже самый большой город.';
  const c=UPC[p.lvl];
  if(S.gold[f]<c)return 'Не хватает золота.';
  S.gold[f]-=c;p.lvl++;return null;
}

/* --- дипломатия --- */
function declareWar(a,b){
  if(a===b||a==='n'||b==='n')return;
  const k=pk(a,b);
  if(S.ally[k]){delete S.ally[k];FK.forEach(g=>{if(g!==a)addRel(a,g,-12)});}
  if(S.mar&&S.mar[k]){delete S.mar[k];addRel(a,b,-20)}
  if(S.trade)delete S.trade[k];
  if(S.vas&&(S.vas[a]===b||S.vas[b]===a)){delete S.vas[a===S.vas[b]?b:a]}
  S.war[k]=true;addRel(a,b,-40);tlog({k:'war',a,b});
  FK.forEach(g=>{if(g!==a&&g!==b)addRel(a,g,-4)});
  if(b===S.player)logm(fname(a)+' объявила вам войну!','w');
  else if(a===S.player)logm('Вы объявили войну: '+fname(b)+'.','w');
}
function makePeace(a,b){delete S.war[pk(a,b)];addRel(a,b,25);tlog({k:'peace',a,b});
  if(a===S.player||b===S.player)logm('Заключён мир: '+fname(a===S.player?b:a)+'.','g')}
function offerPeace(ai){
  const me=S.player;
  const r=strength(ai)/Math.max(strength(me),1);
  const gift=S.flags['gift'+ai]||0;
  let ch=Math.max(.1,Math.min(.85,.8-.4*r))+Math.min(.25,gift*.01);
  if(relOf(me,ai)<-80)ch=.05;
  if(rnd()<ch){makePeace(me,ai);return true}
  return false;
}
function offerAlliance(ai){
  const me=S.player;
  if(atWar(me,ai)||relOf(me,ai)<40)return false;
  if(rnd()<.6){S.ally[pk(me,ai)]=true;addRel(me,ai,20);logm('Союз с '+fname(ai)+'.','g');return true}
  return false;
}
function breakAlliance(ai){delete S.ally[pk(S.player,ai)];addRel(S.player,ai,-25)}
function giftTo(ai){
  if(S.gold[S.player]<100)return false;
  S.gold[S.player]-=100;addRel(S.player,ai,15);S.flags['gift'+ai]=(S.flags['gift'+ai]||0)+10;return true;

/* --- ход --- */
function frontline(f,i){return GEO.adj[i].some(j=>S.prov[j].o!==f&&atWar(f,S.prov[j].o)&&!isAlly(f,S.prov[j].o))}
function endTurn(){
  S.pending=[];S.techNews=[];S.notes=[];S.tl=[];S.hq=[];S.rec=true;
  FK.forEach(f=>{if(f!==S.player&&alive(f))aiTurn(f)});
  S.rec=false;tickSieges();
  FK.forEach(f=>{
    if(!alive(f))return;
    S.gold[f]+=net(f);tickResearch(f);
    if(S.gold[f]<0){
      let guard=300;
      while(S.gold[f]<0&&guard--){
        const arm=own(f).filter(i=>S.prov[i].army&&usize(S.prov[i].army.u)>0);
        if(!arm.length){S.gold[f]=0;break}
        const i=pick(arm),u=S.prov[i].army.u;
        const k=UK.slice().reverse().find(k=>u[k]>0);
        if(!u[k]){continue}
        u[k]--;S.gold[f]+=U[k].up*3;
        if(usize(u)===0)S.prov[i].army=null;
      }
      if(S.gold[f]<0)S.gold[f]=0;
      if(f===S.player)logm('Казна пуста: часть войск разошлась по домам.','w');
    }
  });
  S.prov.forEach((p,i)=>{
    if(p.q){p.q.left--;if(p.q.left<=0){p.b.push(p.q.id);if(p.o===S.player)logm('Построено: '+BLD[p.q.id].n+' в городе '+pname(i)+'.','g');p.q=null}}
    p.rec=0;if(p.army)p.army.mv=false;
    const f=p.o;
    if(f==='n'){if(p.g<gcap(i))p.g++;p.loy=70;return}
    const T=70+TAXN[S.tax[f]].t+(p.army?10:0)+(isCap(i)?10:0)+(has(i,'temple')?15:0)-(p.rg&&p.rg!==rgOf(f)?(has(i,'temple')?6:12):0)+getFx(f).loy+(govOf(i)?Math.round(gEff(govOf(i)).adm*1.2):0);
    p.loy+=Math.max(-8,Math.min(8,T-p.loy));
    p.loy=Math.max(0,Math.min(100,p.loy));
    if(p.rg&&p.rg!==rgOf(f)&&rnd()<(has(i,'temple')?.05:.015))p.rg=rgOf(f);
    if(p.g<gcap(i))p.g++;
    if(p.loy<15&&!p.army&&rnd()<.35){
      if(f===S.player)logm('Восстание! '+pname(i)+' вышел из подчинения.','w');
      p.gens.slice().forEach(id=>gKill(id,'погиб во время восстания в '+pname(i),null));
      p.o='n';p.realm='Мятежники';p.g=gcap(i)+1;p.loy=70;
    }
  });
  Object.keys(S.rel).forEach(k=>{
    if(!S.war[k]){const v=S.rel[k];if(v<50)S.rel[k]=v+1}
  });
  S.year++;S.turn++;tickGens();tickDyn();tickDip();tickCourt();histTick();
  if(!alive(S.player)){S.flags.lost=true}
  const n=own(S.player).length;
  if(n>=WIN_AT&&!S.flags.won){S.flags.won=true}
  if(S.year>=END_YEAR&&!S.flags.won&&!S.flags.timeup){S.flags.timeup=true}
  if(S.turn>=3&&!S.hq.length&&!S.flags.lost&&rnd()<.16)S.event=pick(EVENTS).id;
  saveGame();
}

function loadGame(){try{const t=localStorage.getItem(SAVEKEY);if(!t)return null;const s=JSON.parse(t);if(!s||s.ver!==4||!s.prov||s.prov.length!==PR.length)return null;S=s;if(!S.dyn)initDyn();if(!S.hs)initDip();if(!S.cf)initCourt();S.tl=S.tl||[];S.hist=S.hist||{};S.hq=S.hq||[];S.rec=false;S.sup=S.sup||{};S.pCd=S.pCd||{};FXC={};return S}catch(e){return null}}

function has(i,b){return S.prov[i].b.includes(b)}

function slotsUsed(i){const p=S.prov[i];return p.b.length+(p.q?1:0)}
function build(i,id){
  const p=S.prov[i],f=p.o,B=BLD[id];
  if(p.q)return 'В городе уже идёт стройка.';
  if(has(i,id))return 'Это здание уже построено.';
  if(slotsUsed(i)>=SLOTS[p.lvl])return 'Нет свободных мест. Улучшите город.';
  const bc=bcost(f,id);

}

/* --- исследования --- */
function techState(f,id){
  const t=TECH[id];
  if(S.res.done[f].includes(id))return 'done';
  if(S.res.cur[f]&&S.res.cur[f].id===id)return 'cur';
  return 'open';
}
function canResearch(f,id){
  const t=TECH[id];
  if(t.f&&t.f!==f)return 'Это исследование другой державы.';
  if(S.res.done[f].includes(id))return 'Уже изучено.';
  if(S.res.cur[f])return 'Учёные заняты другим исследованием.';
  if(t.r&&!S.res.done[f].includes(t.r))return 'Сначала изучите: '+TECH[t.r].n+'.';
  if(S.gold[f]<t.c)return 'Не хватает золота.';
  return null;
}
function startResearch(f,id){const e=canResearch(f,id);if(e)return e;S.gold[f]-=TECH[id].c;S.res.cur[f]={id,left:TECH[id].t};return null}
function tickResearch(f){
  const c=S.res.cur[f];if(!c)return;
  c.left--;
  if(c.left<=0){
    S.res.done[f].push(c.id);S.res.cur[f]=null;FXC={};
    if(f===S.player){S.techNews.push(c.id);logm('Изучено: '+TECH[c.id].n+'.','g')}
  }

function availTech(f){return Object.keys(TECH).filter(id=>{const t=TECH[id];return (!t.f||t.f===f)&&!S.res.done[f].includes(id)&&(!t.r||S.res.done[f].includes(t.r))})}

/* ===== ПОЛКОВОДЦЫ: ЛОГИКА ===== */
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function gEff(g){
  const s={cmd:g.cmd,tac:g.tac,adm:g.adm,atk:0,def:0};
  g.tr.forEach(t=>{const m=TRAIT[t].m;for(const k in m)s[k]=(s[k]||0)+m[k]});
  s.cmd=clamp(s.cmd,1,12);s.tac=clamp(s.tac,1,12);s.adm=clamp(s.adm,1,12);
  return s;
}
const gRank=g=>Math.min(5,Math.floor(g.xp/60));
const gAge=g=>(g.dead||S.year)-g.born;
function gFullName(g){return g.name+(g.epi?' '+g.epi:'')}
function gBio(g,t){g.bio.push({y:S.year,t});if(g.bio.length>40)g.bio.splice(1,1)}
function bestGen(ids){
  let b=null,bs=-1;
  ids.forEach(id=>{const g=S.gens[id];if(!g||g.dead)return;const sc=gRank(g)*20+gEff(g).cmd;if(sc>bs){bs=sc;b=id}});
  return b;
}
function leaderOf(i){const p=S.prov[i];if(S.dyn&&S.dyn[p.o]&&S.dyn[p.o].regency>0)return null;return p.army&&p.gens.length?bestGen(p.gens):null}
function govOf(i){const p=S.prov[i];let b=null,bs=-1;p.gens.forEach(id=>{const g=S.gens[id];if(!g||g.dead)return;const a=gEff(g).adm;if(a>bs){bs=a;b=g}});return b}
function addGen(i,id){const p=S.prov[i];if(!p.gens.includes(id))p.gens.push(id);S.gens[id].loc=i}
function remGen(i,id){const p=S.prov[i];const k=p.gens.indexOf(id);if(k>=0)p.gens.splice(k,1)}
function nGens(f){let n=0;for(const id in S.gens){const g=S.gens[id];if(g.f===f&&!g.dead)n++}return n}
function maxGens(f){return 3+Math.floor(own(f).length/5)}
function pickName(f){return pick(GNAMES[f])}
function makeGen(f,loc,age,how){
  const id='g'+(++S.gseq);
  const tr=pick(GSTART);
  const cmd=3+Math.floor(rnd()*4),tac=3+Math.floor(rnd()*4),adm=3+Math.floor(rnd()*4);
  const g={id,f,name:pickName(f),house:pick(GHOUSE[f]),born:S.year-age,cmd,tac,adm,xp:Math.floor(rnd()*40),tr:[tr],bio:[],seed:Math.floor(rnd()*1e6),w:0,cap:0,b:0,dead:0,loc:loc,hero:0,orig:pick(GORIGIN)};
  const e=gEff(g);
  const top=['cmd','tac','adm'].sort((a,b)=>e[b]-e[a]||rnd()-.5)[0];
  g.epi=pick(GEPI[top]);
  const city=pname(loc);
  g.bio.push({y:g.born,t:'Родился в окрестностях города '+city+'. '+g.orig+' ('+g.house+').'});
  if(how)gBio(g,how);
  S.gens[id]=g;addGen(loc,id);
  return g;
}
function gKill(id,why,notes){
  const g=S.gens[id];if(!g||g.dead)return;
  g.dead=S.year;gBio(g,why);
  if(g.loc!==undefined&&g.loc>=0)remGen(g.loc,id);
  const t=gFullName(g)+': '+why;
  if(g.f===S.player){logm(t,'w');if(!S.inB)S.notes.push({t:'Потеря: '+gFullName(g),x:why[0].toUpperCase()+why.slice(1)+'. Ему было '+gAge(g)+' лет.'})}
  if(notes)notes.push(gFullName(g)+' '+why+'.');
}
function gXp(id,n,notes){
  const g=S.gens[id];if(!g||g.dead)return;
  const r0=gRank(g);g.xp+=n;const r1=gRank(g);
  if(notes)notes.push(gFullName(g)+': +'+n+' опыта.');
  if(r1>r0){
    const st=pick(['cmd','tac','adm']);g[st]++;
    const nm={cmd:'Командование',tac:'Тактика',adm:'Управление'}[st];
    gBio(g,'Получил звание «'+GRANK[r1]+'»: '+nm.toLowerCase()+' выросло.');
    const t=gFullName(g)+' получил звание «'+GRANK[r1]+'» ('+nm+' +1).';
    if(g.f===S.player)logm(t,'g');
    if(notes)notes.push(t);
  }
}
function gTrait(id,tr,txt,notes){
  const g=S.gens[id];if(!g||g.dead||g.tr.includes(tr))return;
  g.tr.push(tr);gBio(g,txt+' Теперь он «'+TRAIT[tr].n+'».');

}
function gPow(gid,att){
  if(!gid)return 1;
  const s=gEff(S.gens[gid]);
  return 1+s.cmd*.025+(att?s.atk:s.def+s.tac*.008);
}
function tmWith(tact,gid){
  const base=TACT[tact].m;
  if(!gid||tact==='line')return base;
  const k=1+gEff(S.gens[gid]).tac*.05,r={};
  for(const u in base){const m=base[u];r[u]=m>1?1+(m-1)*k:m}
  return r;
}
function hireGen(f,loc){
  if(S.gold[f]<250)return 'Нужно 250 золота.';
  if(nGens(f)>=maxGens(f))return 'Достигнут предел: '+maxGens(f)+' полководцев. Он растёт вместе с землями.';
  S.gold[f]-=250;
  const g=makeGen(f,loc,22+Math.floor(rnd()*8),'Принят на службу в '+pname(loc)+'.');
  if(f===S.player)logm('На службу принят полководец: '+gFullName(g)+'.','i');

    const others=mine.filter(i=>i!==cap).sort((a,b)=>(S.prov[b].army?usize(S.prov[b].army.u):0)-(S.prov[a].army?usize(S.prov[a].army.u):0));

function tickGens(){
  Object.values(S.gens).forEach(g=>{
    if(g.dead)return;
    const a=gAge(g);

  });

    if(!alive(f))return;
    if(nGens(f)<maxGens(f)&&rnd()<(f===S.player?.05:.12)){
      const mine=own(f),free=mine.filter(i=>!S.prov[i].gens.length);
      const loc=free.length?pick(free):capIdx(f);
      if(loc>=0){const g=makeGen(f,loc,20+Math.floor(rnd()*10),'Прославился при дворе и получил под начало людей.');
        if(f===S.player){logm('Молодой полководец: '+gFullName(g)+' в городе '+pname(loc)+'.','i');S.notes.push({t:'Новый полководец',x:gFullName(g)+' прибыл в '+pname(loc)+'. '+g.orig+' ('+g.house+').'})}}
    }
  });
}

function moveGeneral(id,to){
  const g=S.gens[id];
  if(!g||g.dead||g.f!==S.player)return 'Недоступно.';
  if(S.prov[to].o!==S.player)return 'Только в свои города.';
  if(!GEO.adj[g.loc].includes(to))return 'Только в соседний город.';
  if(g.mvT===S.turn)return 'В этом году он уже переезжал.';
  remGen(g.loc,id);addGen(to,id);g.mvT=S.turn;

const RT={

greedy:{n:'Алчный',d:'Доход +5%, лояльность −2',e:{inc:.05,loy:-2}},

const ELECT=['ven','teu'];
const ROM=['','','II','III','IV','V','VI','VII','VIII'];
function dynName(f){
  const d=S.dyn[f];let nm=pick(GNAMES[f]);
  d.cnt[nm]=(d.cnt[nm]||0)+1;
  return nm+(d.cnt[nm]>1?' '+(ROM[d.cnt[nm]]||d.cnt[nm]):'');
}
function newRuler(f,age){
  const tr=[pick(RTK)];if(rnd()<.35){const t=pick(RTK);if(!tr.includes(t))tr.push(t)}
  return {name:dynName(f),born:S.year-age,tr};
}
function initDyn(){
  S.dyn={};S.mar={};
  FK.forEach(f=>{
    S.dyn[f]={cnt:{},ruler:null,heir:null};
    const r=newRuler(f,28+Math.floor(rnd()*18));S.dyn[f].ruler=r;
    if(!ELECT.includes(f)&&rnd()<.7)S.dyn[f].heir={name:dynName(f),born:S.year-(2+Math.floor(rnd()*16)),tr:[pick(RTK)]};
  });

}
const rAge=r=>S.year-r.born;
function rulerFx(f,fx){
  const d=S.dyn&&S.dyn[f];if(!d||!d.ruler)return;
  d.ruler.tr.forEach(t=>{const e=RT[t].e;for(const k in e)fx[k]=(fx[k]||0)+e[k]});
  if(rAge(d.ruler)<16)fx.all=(fx.all||0)-.05;
  if(d.regency>0)fx.all=(fx.all||0)-.1;
}
function rulerTxt(f){const d=S.dyn[f];return d.regency>0?'Регентский совет':RTITLE[f]+' '+d.ruler.name}
function rTr(f,t){const d=S.dyn&&S.dyn[f];return !!(d&&d.ruler&&d.ruler.tr.includes(t))}
function warMul(f){let m=1;if(rTr(f,'war'))m*=1.6;if(rTr(f,'cruel'))m*=1.3;if(rTr(f,'timid'))m*=.6;if(rTr(f,'peace'))m*=.3;if(S.dyn[f]&&S.dyn[f].regency>0)m*=.2;return m}
function peaceMul(f){let m=1;if(rTr(f,'peace'))m*=3;if(rTr(f,'diplo'))m*=1.8;if(rTr(f,'war'))m*=.4;if(rTr(f,'cruel'))m*=.7;return m}
function tlRule(f,txt){S.tl=S.tl||[];S.tl.push({k:'rule',f,txt})}
/* новый правитель меняет курс державы */
function settleRuler(f){
  const me=S.player,nr=S.dyn[f].ruler,msgs=[];
  const rec=S.rec;S.rec=true;
  FK.forEach(g=>{
    if(g===f||!alive(g))return;
    const k=pk(f,g);
    if(S.trade[k]&&!rTr(f,'diplo')&&rnd()<.3){delete S.trade[k];if(g===me)msgs.push('Торговый договор расторгнут.')}
    if(S.ally[k]&&relOf(f,g)<50&&rnd()<(rTr(f,'war')||rTr(f,'cruel')?.35:.12)){delete S.ally[k];if(g===me)msgs.push('Союз расторгнут.')}
    if(rTr(f,'peace')||rTr(f,'diplo'))addRel(f,g,8);
    if(rTr(f,'war')||rTr(f,'cruel'))addRel(f,g,-6);
  });
  if(rTr(f,'peace')){
    FK.filter(g=>g!==f&&alive(g)&&S.war[pk(f,g)]).forEach(g=>{
      if(rnd()<.65){
        if(g===me)S.pOffer={f,fresh:true};
        else{makePeace(f,g);tlRule(f,'Новый правитель, '+nr.name+', предлагает мир: '+fname(g)+'.')}
      }
    });
  }else if(rTr(f,'war')&&S.turn>=GRACE_WAR&&rnd()<.5){
    const nb=neighborFactions(f).filter(g=>!S.war[pk(f,g)]&&!isAlly(f,g)&&!(S.mar&&S.mar[pk(f,g)])&&!S.vas[g]&&!S.vas[f]&&S.turn>=GRACE_WAR);
    if(nb.length){const g=pick(nb);declareWar(f,g);tlRule(f,'Воинственный '+nr.name+' начинает войну: '+fname(g)+'.')}
  }
  S.rec=rec;FXC={};
  if(msgs.length)S.notes.push({t:'Перемены при дворе: '+fname(f),x:msgs.join(' ')});
}
function defect(f,n){
  const c=own(f).filter(i=>!isCap(i)).sort((a,b)=>S.prov[a].loy-S.prov[b].loy).slice(0,Math.min(n,Math.max(0,own(f).length-2)));
  c.forEach(i=>{const p=S.prov[i];p.gens.slice().forEach(id=>gKill(id,'погиб во время мятежа в '+pname(i),null));p.o='n';p.realm='Мятежники';p.g=gcap(i)+1;p.loy=70;p.army=null;delete p.siege});
  return c;
}
function succession(f,why){
  const d=S.dyn[f],old=d.ruler,oldTxt=RTITLE[f]+' '+old.name,me=S.player;
  d.regency=0;
  if(ELECT.includes(f)){
    d.ruler=newRuler(f,42+Math.floor(rnd()*14));
    const t=(f==='ven'?'Большой совет избрал нового дожа':'Капитул избрал нового великого магистра')+': '+d.ruler.name+'.';
    announce(f,oldTxt,why,t);settleRuler(f);return;
  }
  if(d.heir){
    const nr={name:d.heir.name,born:d.heir.born,tr:d.heir.tr.slice()};
    if(rnd()<.5){const t=pick(RTK);if(!nr.tr.includes(t))nr.tr.push(t)}
    d.heir=null;d.ruler=nr;
    announce(f,oldTxt,why,'Престол занял наследник: '+nr.name+(rAge(nr)<16?' (ему всего '+rAge(nr)+' лет, при дворе регент)':'')+'.');
    settleRuler(f);return;
  }
  // кризис наследования
  const a=newRuler(f,24+Math.floor(rnd()*16));let b=newRuler(f,24+Math.floor(rnd()*16));
  if(b.name===a.name)b.name+=' Младший';
  while(b.tr[0]===a.tr[0])b.tr=[pick(RTK)];
  own(f).forEach(i=>{const p=S.prov[i];p.loy=Math.max(0,p.loy-15)});
  const lost=defect(f,Math.ceil(own(f).length*.12));
  const lt=lost.length?' Города отложились: '+lost.map(pname).join(', ')+'.':'';
  d.cands=[a,b];
  if(f===me){
    d.ruler={name:'Регентский совет',born:S.year-40,tr:[]};
    S.pc={cands:[a,b]};
    logm(oldTxt+' '+why+'. Наследника нет, двор раскололся.'+lt,'w');
  }else{
    d.ruler={name:'Регентский совет',born:S.year-40,tr:[]};
    d.regency=2+Math.floor(rnd()*3);
    tlRule(f,oldTxt+' '+why+'. Наследника нет, начинается борьба за власть между '+a.name+' и '+b.name+'.'+lt);
    logm(fname(f)+': '+oldTxt+' '+why+'. Наследника нет, борьба за власть.'+lt,'i');
  }
  FXC={};
}
function announce(f,oldTxt,why,t){
  const msg=oldTxt+' '+why+'. '+t;
  if(f===S.player){logm(msg,'w');S.notes.push({t:'Смена правителя',x:msg+' Черты: '+S.dyn[f].ruler.tr.map(x=>RT[x].n).join(', ')+'.'})}
  else{tlRule(f,msg+' Черты: '+S.dyn[f].ruler.tr.map(x=>RT[x].n).join(', ')+'.');logm(fname(f)+': '+msg,'i')}
}
function resolveCrisis(f,idx){
  const d=S.dyn[f],c=d.cands;
  if(idx===undefined){const sup=S.sup&&S.sup[f];idx=sup!==undefined&&sup!==null?(rnd()<.85?sup:1-sup):(rnd()<.5?0:1)}
  d.ruler=c[idx];d.cands=null;d.regency=0;if(S.sup)delete S.sup[f];
  FXC={};
  const t='Борьба за власть окончена: престол занял '+d.ruler.name+'. Черты: '+d.ruler.tr.map(x=>RT[x].n).join(', ')+'.';
  if(f===S.player)logm(t,'g');else{tlRule(f,fname(f)+': '+t);logm(fname(f)+': '+t,'i')}
  settleRuler(f);
  return idx;
}
function supportClaimant(f,idx){
  const me=S.player,d=S.dyn[f];
  if(!(d.regency>0)||!d.cands)return 'Борьбы за власть сейчас нет.';
  if(S.gold[me]<200)return 'Нужно 200 золота.';
  S.sup=S.sup||{};
  if(S.sup[f]!==undefined)return 'Вы уже сделали ставку.';
  S.gold[me]-=200;S.sup[f]=idx;
  logm('Золото ушло к претенденту '+d.cands[idx].name+' ('+fname(f)+').','i');
  return 'Вы поддержали претендента '+d.cands[idx].name+'. Если он победит, отношения с державой улучшатся.';
}
function tickDyn(){
  if(!S.dyn)return;
  FK.forEach(f=>{
    if(!alive(f))return;
    const d=S.dyn[f];
    if(d.regency>0){
      d.regency--;
      if(d.regency<=0&&d.cands){const sup=S.sup&&S.sup[f],idx=resolveCrisis(f);if(sup!==undefined&&idx===sup)addRel(S.player,f,25)}
      return;
    }
    if(f===S.player&&S.pc)return;
    const r=d.ruler,a=rAge(r);
    const dp=a>=48?(a-47)*.022+(r.tr.includes('sick')?.04:0):(r.tr.includes('sick')?.02:.004);
    if(rnd()<dp){succession(f,a>=60?'умер в старости':(rnd()<.4?'пал в бою':'скончался от болезни'));return}
    if(!d.heir&&!ELECT.includes(f)&&a<50&&rnd()<.2){
      d.heir={name:dynName(f),born:S.year,tr:[pick(RTK)]};
      if(f===S.player){logm('У правителя родился наследник: '+d.heir.name+'.','g');S.notes.push({t:'Родился наследник',x:rulerTxt(f)+' обрёл наследника: '+d.heir.name+'. Черта: '+RT[d.heir.tr[0]].n+'.'})}
    }
  });
  const al=FK.filter(alive);
  if(rnd()<.05){const a=pick(al),b=pick(al),k=pk(a,b);
    if(a!==b&&a!==S.player&&b!==S.player&&!S.war[k]&&!S.mar[k]&&!ELECT.includes(a)&&!ELECT.includes(b)){S.mar[k]=true;addRel(a,b,25)}}
}
function canWed(g){
  const me=S.player,d=S.dyn[me];
  if(ELECT.includes(me)||ELECT.includes(g))return 'Здесь правителей избирают, династических браков нет.';
  if(!d.heir)return 'У вас нет наследника.';
  if(S.mar[pk(me,g)])return 'Вы уже в родстве.';
  if(atWar(me,g))return 'Идёт война.';

}
function wed(g){
  const me=S.player,e=canWed(g);if(e)return e;
  if(S.gold[me]<200)return 'Нужно 200 золота на свадьбу.';
  S.gold[me]-=200;
  if(rnd()<Math.max(.2,Math.min(.9,.45+relOf(me,g)/120))){
    S.mar[pk(me,g)]=true;addRel(me,g,30);S.gold[me]+=120;
    logm('Династический брак с '+fname(g)+'.','g');
    return 'Брак заключён. Получено 120 золота приданого. Отношения сильно лучше, и они не нападут на вас.';

/* --- осады и флот --- */
const SHIP_COST=120,SHIP_MAX=3;
function isSea(i,j){if(!GEO.seaS)GEO.seaS=new Set(GEO.sea.map(([a,b])=>a<b?a+'|'+b:b+'|'+a));return GEO.seaS.has(i<j?i+'|'+j:j+'|'+i)}
function isPort(i){return GEO.adj[i].some(j=>isSea(i,j))}
function linkOk(from,to){return !isSea(from,to)||S.prov[from].o!==S.player||(S.prov[from].ships||0)>0}
function buildShip(i){
  const p=S.prov[i],f=p.o;
  if(!isPort(i))return 'Здесь нет выхода к морским путям.';
  if((p.ships||0)>=SHIP_MAX)return 'В порту уже '+SHIP_MAX+' корабля.';
  if(S.gold[f]<SHIP_COST)return 'Не хватает золота.';
  S.gold[f]-=SHIP_COST;p.ships=(p.ships||0)+1;return null;
}
const isFort=i=>has(i,'walls')||S.prov[i].lvl>=2||isCap(i);
function canSiege(from,to){
  const a=S.prov[from],b=S.prov[to];
  return canAttackLoose(from,to)&&isFort(to)&&!b.siege&&linkOk(from,to);
}
function canAttackLoose(from,to){const a=S.prov[from],b=S.prov[to];return !!a.army&&!a.army.mv&&a.o!==b.o&&GEO.adj[from].includes(to)&&atWar(a.o,b.o)}
function startSiege(from,to){
  const A=S.prov[from],D=S.prov[to];
  A.army.mv=true;A.army.sg=to;
  D.siege={f:A.o,from,t:0};
  logm('Осада города '+pname(to)+'.','i');
}
function siegeTake(i){
  const D=S.prov[i],s=D.siege,A=S.prov[s.from],af=A.o,df=D.o;
  D.gens.slice().forEach(id=>gKill(id,'попал в плен при сдаче города '+pname(i),null));
  moveArmy(s.from,i);
  D.o=af;D.loy=30;D.g=0;D.rec=0;D.realm='';D.q=null;D.ships=0;delete D.siege;
  if(af===S.player||df===S.player)S.notes.push({t:af===S.player?'Город сдался':'Город потерян',x:af===S.player?'Осада принесла плоды: '+pname(i)+' сдался без штурма.':pname(i)+' сдался после осады.'});
  logm(pname(i)+' сдался после осады.',af===S.player?'g':'w');
  if(df!=='n'&&!alive(df))logm(fname(df)+' пала.','w');
}
function tickSieges(){
  S.prov.forEach((p,i)=>{
    const s=p.siege;if(!s)return;
    const A=S.prov[s.from];
    if(A.o!==s.f||!A.army||A.army.sg!==i||!atWar(A.o,p.o)||p.o===s.f){delete p.siege;if(A.army&&A.army.sg===i)delete A.army.sg;return}
    s.t++;
    p.g=Math.max(0,p.g-1-(s.t>2?1:0));
    p.loy=Math.max(0,p.loy-8);
    if(p.army){UK.forEach(k=>{p.army.u[k]=Math.floor((p.army.u[k]||0)*.88)});if(usize(p.army.u)===0)p.army=null}
    if(s.t>=3){const u=A.army.u;UK.forEach(k=>{const n=u[k]||0;if(n>1)u[k]=Math.floor(n*.96)})}
    if(!p.army&&p.g<=0)return siegeTake(i);
    if(s.t>=5&&estimate(s.from,i,'line').ratio>=2.2)return siegeTake(i);
  });
}

const RG={cath:'Католичество',orth:'Православие',isl:'Ислам',teng:'Тенгрианство'};
const FRG={eng:'cath',fra:'cath',hre:'cath',esp:'cath',ven:'cath',por:'cath',sca:'cath',sco:'cath',pol:'cath',hun:'cath',teu:'cath',byz:'orth',rus:'orth',moo:'isl',tur:'isl',egy:'isl',hor:'teng'};
const rgOf=f=>FRG[f]||'cath';
function initDip(){
  S.trade={};S.vas={};S.ult=null;S.spy=-1;S.zeal={};S.hs=S.hs||[];S.st=S.st||{bw:0,bl:0,cap:0,lost:0};
  S.prov.forEach(p=>{if(p.o!=='n')p.rg=rgOf(p.o)});
  S.prov.forEach((p,i)=>{
    if(p.o!=='n')return;
    let b=null,bd=1e9;
    S.prov.forEach((q,j)=>{if(q.o==='n')return;const d=Math.hypot(GEO.pts[i][0]-GEO.pts[j][0],GEO.pts[i][1]-GEO.pts[j][1]);if(d<bd){bd=d;b=q}});
    p.rg=b?b.rg:'cath';
  });
}
function tradeCount(f){let n=0;for(const k in S.trade){const [a,b]=k.split('|');if(a===f||b===f)n++}return Math.min(n,3)}
const lordOf=f=>S.vas[f]||null;
function vassalsOf(f){return Object.keys(S.vas).filter(v=>S.vas[v]===f&&alive(v))}
function zealOn(f,t){S.zeal[f]=Math.max(S.zeal[f]||0,t);FXC={}}
/* торговый договор */
function offerTrade(g){
  const me=S.player,k=pk(me,g);
  if(atWar(me,g))return 'Нельзя торговать во время войны.';
  if(S.trade[k]){delete S.trade[k];return 'Договор расторгнут.'}
  if(relOf(me,g)<0)return 'Им нужно больше доверия.';
  if(rnd()<.8){S.trade[k]=true;addRel(me,g,8);logm('Торговый договор с '+fname(g)+'.','g');return 'Договор заключён: доход обеих держав растёт.'}
  return 'Они отказались.';
}
/* вассалитет */
function demandVassal(g){
  const me=S.player,war=atWar(me,g),r=strength(me)/Math.max(strength(g),1);
  if(S.vas[g])return 'Они уже вассал.';
  if(lordOf(me))return 'Вы сами вассал.';
  if(g===lordOf(me))return '';
  if(isAlly(me,g))return 'Нельзя требовать вассалитета у союзника.';
  if(r<(war?1.6:3))return war?'Вы пока недостаточно сильны, чтобы диктовать условия.':'Они не считают вас достаточно сильным.';
  if(rnd()<(war?.75:.5)){
    if(war)makePeace(me,g);
    S.vas[g]=me;addRel(me,g,-10);delete S.ally[pk(me,g)];
    FK.forEach(x=>{if(x!==me&&x!==g&&S.ally[pk(x,g)]&&atWar(x,me)){delete S.ally[pk(x,g)]}});
    logm(fname(g)+' стала вашим вассалом.','g');return 'Они признали вас сюзереном и будут платить четверть дохода.';
  }
  addRel(me,g,-20);return 'Они отвергли требование.';
}
/* требование города */
function demandProv(g){
  const me=S.player;
  if(isAlly(me,g)||(S.mar&&S.mar[pk(me,g)]))return 'Родичам и союзникам такого не предъявляют.';
  const c=[];own(g).forEach(i=>{if(!isCap(i)&&GEO.adj[i].some(j=>S.prov[j].o===me&&linkOk(j,i)))c.push(i)});
  if(!c.length)return 'У ваших границ нет подходящих городов.';
  c.sort((a,b)=>S.prov[a].lvl-S.prov[b].lvl);
  const i=c[0],r=strength(me)/Math.max(strength(g),1);
  if(r>=2.2&&rnd()<.7){
    const p=S.prov[i];p.o=me;p.loy=30;p.army=null;p.g=0;p.q=null;p.siege&&delete p.siege;p.gens.slice().forEach(id=>gKill(id,'остался без места при передаче города '+pname(i),null));
    addRel(me,g,-25);logm(fname(g)+' уступила город '+pname(i)+'.','g');
    if(!alive(g))logm(fname(g)+' пала.','w');
    return 'Они уступили город '+pname(i)+', боясь войны.';
  }
  addRel(me,g,-15);
  if(!atWar(me,g)&&rnd()<.3&&S.turn>=GRACE_WAR)declareWar(g,me);
  return r<2.2?'Они отказались: вы недостаточно сильны.':'Они отказались.';
}
/* священная война */
function holyWar(a,b){
  if(rgOf(a)===rgOf(b))return;
  if(!atWar(a,b))declareWar(a,b);
  zealOn(a,8);zealOn(b,8);
}
function holyWarPlayer(g){
  const me=S.player;
  if(rgOf(me)===rgOf(g))return 'У вас одна вера.';
  if(S.gold[me]<100)return 'Нужно 100 золота на проповедь.';
  if((S.zeal[me]||0)>0)return 'Дух похода уже поднят.';
  S.gold[me]-=100;holyWar(me,g);
  logm('Священная война против '+fname(g)+'.','w');
  return 'Объявлена священная война. 8 ходов войска +8%, лояльность +4. Но и враг воодушевлён.';
}

const SPY=[

 {id:'bribe',n:'Подкуп гарнизона',cost:300,p:.5,d:'Слабо охраняемый приграничный город переходит к вам'},

 {id:'heir',n:'Убить наследника',cost:400,p:.35,d:'У державы не останется преемника. Смерть правителя вызовет смуту'},
 {id:'claim',n:'Убить претендента',cost:350,p:.4,d:'Только в смуту: соперник сядет на трон. Он будет вам обязан'},

function expose(g,id){
  const me=S.player;let t='Следы ведут к вам.';
  addRel(me,g,-35);FK.forEach(x=>{if(x!==me&&x!==g)addRel(me,x,-(id==='king'?10:5))});
  const k=pk(me,g);delete S.trade[k];
  if(S.mar&&S.mar[k])delete S.mar[k];
  if(S.turn>=GRACE_WAR&&!atWar(me,g)&&!isAlly(me,g)&&!S.vas[g]){declareWar(g,me);t+=' '+fname(g)+' объявила вам войну.'}
  FK.forEach(x=>{if(x!==me&&x!==g&&alive(x)&&isAlly(x,g)&&!atWar(x,me)&&S.turn>=GRACE_WAR&&rnd()<.5){declareWar(x,me);t+=' Союзник '+fname(x)+' тоже вступил в войну.'}});
  return t;
}
function spyDo(g,id){
  const me=S.player,m=SPY.find(x=>x.id===id);
  if(S.spy===S.turn)return 'В этом году вы уже посылали агента.';
  if(S.gold[me]<m.cost)return 'Не хватает золота.';
  if(isAlly(me,g))return 'Союзников не выдают.';
  const dg=S.dyn[g];
  if(dg.regency>0&&(id==='king'||id==='heir')){return 'Правитель сейчас — регентский совет, цели нет.'}
  if(id==='claim'&&!(dg.regency>0&&dg.cands))return 'Смуты в этой державе нет.';
  S.gold[me]-=m.cost;S.spy=S.turn;
  const ok=rnd()<m.p;
  if(!ok){
    addRel(me,g,-30);
    if(!atWar(me,g)&&S.turn>=GRACE_WAR&&rnd()<.35){declareWar(g,me);return 'Агента схватили! '+fname(g)+' объявила вам войну.'}
    return 'Агента схватили. Отношения испорчены.';
  }
  let msg='';
  if(id==='sab'){
    const l=own(g);const i=pick(l),p=S.prov[i];
    if(p.b.length){const b=pick(p.b);p.b=p.b.filter(x=>x!==b);msg='В городе '+pname(i)+' сгорело здание: '+BLD[b].n+'.'}
    else{p.loy=Math.max(0,p.loy-25);msg='В городе '+pname(i)+' вспыхнули беспорядки.'}
  }else if(id==='bribe'){
    const c=[];own(g).forEach(i=>{const p=S.prov[i];if(!isCap(i)&&GEO.adj[i].some(j=>S.prov[j].o===me&&linkOk(j,i))&&(!p.army||usize(p.army.u)<=3))c.push(i)});
    if(!c.length){S.gold[me]+=m.cost;S.spy=-1;return 'Подходящих городов нет, деньги возвращены.'}
    const i=pick(c),p=S.prov[i];
    p.gens.slice().forEach(id2=>gKill(id2,'бежал при подкупе гарнизона города '+pname(i),null));
    p.o=me;p.loy=30;p.army=null;p.g=0;p.q=null;delete p.siege;
    msg='Гарнизон города '+pname(i)+' открыл ворота.';addRel(me,g,-20);
  }else if(id==='kill'){
    const gs=Object.values(S.gens).filter(x=>x.f===g&&!x.dead).sort((a,b)=>b.xp-a.xp);
    if(!gs.length){S.gold[me]+=m.cost;S.spy=-1;return 'У них нет известных полководцев, деньги возвращены.'}
    gKill(gs[0].id,'убит наёмным убийцей',null);msg='Полководец '+gFullName(gs[0])+' убит.';
  }else if(id==='claim'){
    const ix=Math.floor(rnd()*2);msg='Претендент '+dg.cands[ix].name+' ('+fname(g)+') найден мёртвым.';
    resolveCrisis(g,1-ix);addRel(me,g,15);msg+=' Престол занял '+S.dyn[g].ruler.name+'.';
  }else if(id==='heir'){
    const dd=S.dyn[g];
    if(!dd.heir){S.gold[me]+=m.cost;S.spy=-1;return 'У них нет наследника, деньги возвращены.'}
    msg='Наследник '+dd.heir.name+' ('+fname(g)+') погиб при загадочных обстоятельствах.';dd.heir=null;
  }else{
    succession(g,'убит заговорщиками');msg='Правитель '+fname(g)+' мёртв.';addRel(me,g,-20);
  }
  const ex={king:.45,heir:.3,claim:.25}[id]||.1;
  if(rnd()<ex)msg+=' '+expose(g,id);
  logm('Тайная операция: '+msg,'i');
  return msg;
}
/* ультиматум ИИ игроку */
function aiUltimatum(){
  if(S.ult||S.turn<GRACE_WAR+3||S.flags.lost||rnd()>.04)return;
  const me=S.player,sm=Math.max(strength(me),1);
  const c=neighborFactions(me).filter(f=>!S.war[pk(f,me)]&&!isAlly(f,me)&&!(S.mar&&S.mar[pk(f,me)])&&!S.vas[f]&&strength(f)/sm>=2.2);
  if(!c.length)return;
  S.ult={f:pick(c),gold:Math.round(150+own(me).length*30)};
}
/* ход: вассалы, зелоты, религия, статистика */
function tickDip(){
  Object.keys(S.vas).forEach(v=>{
    const l=S.vas[v];
    if(!alive(v)||!alive(l)){delete S.vas[v];return}
    const pay=Math.max(0,Math.round(net(v)*.25));
    S.gold[v]-=pay;S.gold[l]+=pay;
    if(v===S.player)return;
    if(strength(v)>strength(l)*.9&&rnd()<.1){
      delete S.vas[v];
      if(l===S.player){S.notes.push({t:'Вассал взбунтовался',x:fname(v)+' больше не платит дань и объявляет войну.'});logm(fname(v)+' вышла из вассалитета.','w')}
      declareWar(v,l);
    }
  });
  Object.keys(S.zeal).forEach(f=>{if(S.zeal[f]>0){S.zeal[f]--;if(S.zeal[f]<=0){delete S.zeal[f]}FXC={}}});
  const me=S.player;
  S.hs.push({y:S.year,p:own(me).length,g:Math.round(S.gold[me]),s:Math.round(strength(me)),r:Math.max(0,...FK.filter(f=>f!==me).map(f=>own(f).length))});
  if(S.hs.length>260)S.hs.shift();
  aiUltimatum();
}

const CF={nob:{n:'Знать',i:'⚜',up:'Воюйте и берите города, держите налоги умеренными',hi:'Войска +5%',lo:'Лояльность −4'},

function initCourt(){S.cf={nob:50,cle:50,mer:50,arm:50};S.cq=null;S.cqCd=0}

function tickCourt(){
  const me=S.player;if(!S.cf)initCourt();
  CFK.forEach(k=>{const v=S.cf[k];S.cf[k]+=v>50?-1:v<50?1:0});
  (S.tl||[]).forEach(e=>{

    if(e.k==='atk'&&e.t===me&&e.win){cfAdd('arm',-3);cfAdd('nob',-3)}
    if(e.k==='peace'&&(e.a===me||e.b===me)){cfAdd('mer',4);cfAdd('arm',-2)}
    if(e.k==='war'&&e.a===me){cfAdd('mer',-3);cfAdd('nob',2)}

  const t=S.tax[me];
  if(t==='high'){cfAdd('mer',-3);cfAdd('nob',-2)}else if(t==='low'){cfAdd('mer',2);cfAdd('nob',2)}
  const l=own(me),mine=l.filter(i=>S.prov[i].rg===rgOf(me)).length/Math.max(1,l.length);
  cfAdd('cle',mine>=.7?1:-2);
  cfAdd('cle',Math.min(2,l.filter(i=>has(i,'temple')).length*.3));
  cfAdd('mer',tradeCount(me)*1.5);
  if(S.zeal&&S.zeal[me]>0)cfAdd('cle',3);
  if(rTr(me,'war'))cfAdd('arm',1);
  if(rTr(me,'peace')){cfAdd('mer',1);cfAdd('cle',1)}
  if(rTr(me,'pious'))cfAdd('cle',1);
  if(rTr(me,'greedy'))cfAdd('nob',-1);
  if(S.cqCd>0)S.cqCd--;
  if(!S.cq&&S.cqCd<=0&&S.turn>8){
    const k=CFK.filter(x=>S.cf[x]<15).sort((a,b)=>S.cf[a]-S.cf[b])[0];

}

/* ===== ИИ ===== */
function neighborFactions(f){const s=new Set();own(f).forEach(i=>GEO.adj[i].forEach(j=>{const o=S.prov[j].o;if(o!==f&&o!=='n')s.add(o)}));return [...s]}
function stepToFront(f,i){
  const seen=new Set([i]);let q=[[i,null]];
  while(q.length){
    const nq=[];
    for(const [c,first] of q){
      for(const j of GEO.adj[c]){
        if(seen.has(j)||S.prov[j].o!==f)continue;
        seen.add(j);
        const fi=first===null?j:first;
        if(frontline(f,j))return fi;
        nq.push([j,fi]);
      }
    }
    q=nq;
  }
  return null;
}
function aiDiplomacy(f){
  FK.forEach(g=>{
    if(g===f||g===S.player||!alive(g))return;
    if(S.war[pk(f,g)]&&rnd()<.08*peaceMul(f))makePeace(f,g);
  });
  S.pCd=S.pCd||{};
  const me=S.player;
  if(me&&S.war[pk(f,me)]&&!S.pOffer&&(S.pCd[f]||0)<=S.turn){
    const wk=peaceMul(f)*(strength(f)<strength(me)*.6?2:1)*(S.turn<20?.5:1);
    if(rnd()<.03*wk&&relOf(f,me)>-70)S.pOffer={f};
  }
  if(S.dyn[f].regency>0)return;
  const wars=FK.filter(g=>g!==f&&alive(g)&&S.war[pk(f,g)]).length;
  if(wars>=2)return;
  const aggr=[.6,1,1.5][S.diff];
  for(const g of shuffle(neighborFactions(f))){
    if(S.war[pk(f,g)]||isAlly(f,g)||(S.mar&&S.mar[pk(f,g)])||S.vas[f]===g||S.vas[g]===f)continue;
    if(g===S.player&&S.turn<GRACE_WAR)continue;
    const ratio=strength(f)/Math.max(strength(g),1);
    if(ratio>1.4&&relOf(f,g)<45&&rnd()<.035*aggr*warMul(f)*(S.dyn[g].regency>0?2:1)){if(rgOf(f)!==rgOf(g)&&rnd()<.4)holyWar(f,g);else declareWar(f,g);break}
  }
}
function aiEconomy(f){
  const mine=own(f);
  let ups=0;
  for(const i of shuffle(mine)){
    if(ups>=2)break;
    const p=S.prov[i];
    if(p.lvl<3&&(!frontline(f,i)||S.gold[f]>900)&&S.gold[f]-UPC[p.lvl]>250){if(!upgrade(i))ups++}
  }
  const front=mine.filter(i=>frontline(f,i));
  let order=shuffle(front);
  if(S.gold[f]>400||!front.length)order=order.concat(shuffle(mine.filter(i=>!front.includes(i))));
  const reserve=[120,80,40][S.diff];
  let guard=60;
  for(const i of order){
    while(guard-->0&&S.gold[f]>reserve+50&&S.prov[i].rec<recCap(i)){
      const r=rnd();
      const cl=r<.3&&S.gold[f]>350?'knight':(r<.6?'bow':'spear');
      const cand=UK.filter(k=>U[k].cls===cl&&unitOk(f,k)&&(!NEED[k]||has(i,NEED[k]))&&U[k].cost<=S.gold[f]-reserve);
      const uq=cand.find(k=>U[k].f);
      let t=cand.length?(uq&&rnd()<.5?uq:pick(cand)):'spear';
      if(recruit(i,t))break;
    }
  }
}
function aiMoves(f){
  const aggr=[1.35,1.15,1.0][S.diff];
  for(const i of shuffle(own(f))){
    const p=S.prov[i];
    if(p.o!==f||!p.army||p.army.mv)continue;
    const sz=usize(p.army.u);
    if(sz<2)continue;
    let best=null,br=0,bestT='line';
    for(const j of GEO.adj[i]){
      const o=S.prov[j].o;
      if(o===f||isAlly(f,o)||!atWar(f,o))continue;
      if(o===S.player&&S.turn<GRACE_ATK)continue;
      const bt=bestTactic(i,j),e=estimate(i,j,bt);
      if(e.ratio>br){br=e.ratio;best=j;bestT=bt}
    }
    if(best!==null&&br>=aggr){attack(i,best,bestT);continue}
    if(frontline(f,i)){
      if(sz<6){
        const m=GEO.adj[i].find(j=>S.prov[j].o===f&&S.prov[j].army&&usize(S.prov[j].army.u)>sz&&frontline(f,j));
        if(m!==undefined)moveArmy(i,m);
      }
      continue;
    }
    const st=stepToFront(f,i);
    if(st!==null&&sz>=3)moveArmy(i,st);
  }
}
function aiBuild(f){
  let n=0;
  for(const i of shuffle(own(f))){
    if(n>=2)break;
    const p=S.prov[i];
    if(p.q||p.b.length>=SLOTS[p.lvl])continue;
    const fr=frontline(f,i),want=[];
    if(!has(i,'range'))want.push('range');
    if(!has(i,'stables')&&p.lvl>=1)want.push('stables');
    if(!has(i,'market'))want.push('market');
    if(fr&&!has(i,'walls'))want.push('walls');
    if(fr&&!has(i,'barracks'))want.push('barracks');

function terrainSVG(){

  for(let x=6;x<W;x+=11)for(let y=6;y<H;y+=11){
    const px=x+(rn()-.5)*9,py=y+(rn()-.5)*9,lm=landOf([px,py]);
    if(!lm)continue;
    if(GEO.pts.some(c=>Math.hypot(c[0]-px,c[1]-py)<24))continue;
    const [lon,lat]=unproj(px,py),t=terr(lon,lat,lm,rn()),pr=rn();
    const f=n=>n.toFixed(1);
    if(t==='mount'&&pr<.55)P.mount+=`M${f(px-5)},${f(py+3)}L${f(px-1)},${f(py-4)}L${f(px+1.5)},${f(py-.5)}L${f(px+3)},${f(py-2.5)}L${f(px+6)},${f(py+3)}Z`;

  }
  return `<g pointer-events="none"><path d="${P.sand}" fill="none" stroke="#e8c98a" stroke-opacity=".3" stroke-width=".9"/><path d="${P.steppe}" fill="none" stroke="#d8d58a" stroke-opacity=".28" stroke-width=".9"/><path d="${P.forest2}" fill="#07261a" fill-opacity=".34"/><path d="${P.forest}" fill="#0a3320" fill-opacity=".4"/><path d="${P.mount}" fill="#0f151a" fill-opacity=".32" stroke="#ffffff" stroke-opacity=".16" stroke-width=".6"/></g>`;
}

function measure(){const r=$('mapwrap').getBoundingClientRect();UI.w=r.width||300;UI.h=r.height||300}

  s.setAttribute('viewBox',`${(v.cx-vw/2).toFixed(2)} ${(v.cy-vh/2).toFixed(2)} ${vw.toFixed(2)} ${vh.toFixed(2)}`);
  s.style.setProperty('--k',String(1/v.z));

const toMap=(sx,sy)=>({x:UI.v.cx+(sx-UI.w/2)/UI.v.z,y:UI.v.cy+(sy-UI.h/2)/UI.v.z});
function zoomAnchored(anchor,sx,sy,z){

function zoomBy(f,cx,cy){

const ptrs=new Map();let pinch=null,moved=0;
function pdata(){const a=[...ptrs.values()];return{d:Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)||1,mx:(a[0].x+a[1].x)/2,my:(a[0].y+a[1].y)/2}}
function startPinch(){const d=pdata(),r=$('mapwrap').getBoundingClientRect();pinch={d:d.d,z:UI.v.z,m:toMap(d.mx-r.left,d.my-r.top)}}
function bindMap(){
  const el=$('mapwrap');
  el.addEventListener('pointerdown',e=>{
    if(e.target.closest('#zoom'))return;
    ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(ptrs.size===1)moved=0;
    if(ptrs.size===2){moved=99;startPinch()}
  });
  el.addEventListener('pointermove',e=>{
    const p=ptrs.get(e.pointerId);if(!p)return;
    const dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;
    if(ptrs.size===1){
      moved+=Math.abs(dx)+Math.abs(dy);
      if(moved>8){UI.v.cx-=dx/UI.v.z;UI.v.cy-=dy/UI.v.z;applyView()}
    }else if(ptrs.size===2){
      if(!pinch)startPinch();
      const d=pdata(),r=el.getBoundingClientRect();
      zoomAnchored(pinch.m,d.mx-r.left,d.my-r.top,pinch.z*d.d/pinch.d);
    }
  });
  const up=e=>{
    const had=ptrs.has(e.pointerId);
    ptrs.delete(e.pointerId);
    if(ptrs.size<2)pinch=null;
    if(had&&e.type==='pointerup'&&ptrs.size===0&&moved<=8)tapAt(e.clientX,e.clientY);
  };
  el.addEventListener('pointerup',up);
  el.addEventListener('pointercancel',up);
  el.addEventListener('wheel',e=>{e.preventDefault();zoomBy(e.deltaY<0?1.2:1/1.2,e.clientX,e.clientY)},{passive:false});
  $('zin').onclick=()=>zoomBy(1.4);
  $('zout').onclick=()=>zoomBy(1/1.4);
  $('zhome').onclick=()=>{if(S){const c=capIdx(S.player);if(c>=0)focusOn(c,.9)}};
  if(window.ResizeObserver)new ResizeObserver(()=>{measure();applyView()}).observe(el);
  window.addEventListener('resize',()=>{measure();applyView()});
}

const SND={on:(()=>{try{return localStorage.getItem('chron_snd')!=='0'}catch(e){return true}})(),ctx:null};
function actx(){
  if(!SND.ctx){try{SND.ctx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){return null}}
  if(SND.ctx&&SND.ctx.state==='suspended')SND.ctx.resume();
  return SND.ctx;
}
document.addEventListener('pointerdown',()=>{if(SND.on)actx()},true);
function tone(f,d,type,v,t0,f2){
  const c=SND.ctx;if(!c)return;
  const o=c.createOscillator(),g=c.createGain(),t=c.currentTime+(t0||0);
  o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+d+.03);
}
function noise(d,v,fq,t0){
  const c=SND.ctx;if(!c)return;
  const n=Math.floor(c.sampleRate*d),b=c.createBuffer(1,n,c.sampleRate),a=b.getChannelData(0);
  for(let i=0;i<n;i++)a[i]=Math.random()*2-1;
  const s=c.createBufferSource(),fl=c.createBiquadFilter(),g=c.createGain(),t=c.currentTime+(t0||0);
  s.buffer=b;fl.type='bandpass';fl.frequency.value=fq;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  s.connect(fl);fl.connect(g);g.connect(c.destination);s.start(t);
}
function snd(k){
  if(!SND.on||!SND.ctx)return;
  try{
    if(k==='click')tone(640,.05,'square',.03);
    else if(k==='coin'){tone(1200,.08,'triangle',.07);tone(1700,.12,'triangle',.07,.07)}
    else if(k==='march'){[0,.14,.28].forEach(t=>noise(.1,.35,170,t))}
    else if(k==='clash'){noise(.22,.3,1900);tone(240,.18,'sawtooth',.05,0,110)}
    else if(k==='win'){[392,494,587,784].forEach((f,i)=>tone(f,.28,'triangle',.08,i*.13))}
    else if(k==='lose'){[294,247,196].forEach((f,i)=>tone(f,.4,'sawtooth',.05,i*.2))}
    else if(k==='horn'){tone(196,.6,'sawtooth',.06,0,220);tone(294,.6,'sawtooth',.04,.02,330)}
    else if(k==='bell'){tone(880,.6,'sine',.09);tone(1320,.5,'sine',.04,.02)}
  }catch(e){}
}
document.addEventListener('click',e=>{if(e.target.closest&&e.target.closest('button')&&!e.target.closest('#endturn'))snd('click')},true);
function animMove(from,to,col){
  const g=document.getElementById('anim');if(!g||!GEO.pts[from]||!GEO.pts[to])return;
  snd('march');
  const [x1,y1]=GEO.pts[from],[x2,y2]=GEO.pts[to];
  const el=document.createElementNS('http://www.w3.org/2000/svg','g');
  el.innerHTML=`<circle r="7" fill="${col}" stroke="#0b1218" stroke-width="1.5"/><path d="M-3,2L0,-5L3,2Z" fill="#fff"/>`;
  g.appendChild(el);
  const t0=performance.now(),D=650;
  const step=t=>{
    const k=Math.min(1,(t-t0)/D),e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
    el.setAttribute('transform',`translate(${(x1+(x2-x1)*e).toFixed(1)} ${(y1+(y2-y1)*e).toFixed(1)}) scale(${(.9/UI.v.z).toFixed(3)})`);
    if(k<1)requestAnimationFrame(step);else el.remove();
  };
  requestAnimationFrame(step);
}

/* --- слоты сохранения --- */
const slotKey=n=>SAVEKEY+'_s'+n;
function slotInfo(n){
  try{const t=localStorage.getItem(slotKey(n));if(!t)return null;const s=JSON.parse(t);if(!s||!s.prov)return null;
    return {f:s.player,y:s.year,p:s.prov.filter(p=>p.o===s.player).length}}catch(e){return null}
}
function saveSlot(n){try{localStorage.setItem(slotKey(n),JSON.stringify(S));return true}catch(e){return false}}
function loadSlot(n){
  try{const t=localStorage.getItem(slotKey(n));if(!t)return false;localStorage.setItem(SAVEKEY,t);return !!loadGame()}catch(e){return false}
}
function showMenu(msg){
  const h={};
  let html=`<small>Меню</small><h2>Хроники Европы</h2>${msg?`<p class="mut" style="color:var(--brass)">${msg}</p>`:''}<small>Слоты сохранения</small>`;
  [1,2,3].forEach(n=>{
    const i=slotInfo(n);
    html+=`<div class="row sp" style="margin:6px 0"><span class="mut" style="display:inline">${i?`${n}. ${FAC[i.f].n} · ${i.y} · ${i.p} пров.`:`${n}. пусто`}</span><span><button class="btn small" data-m="s${n}">Сохранить</button> <button class="btn small" data-m="l${n}" ${i?'':'disabled'}>Загрузить</button></span></div>`;
    h['s'+n]=()=>{showMenu(saveSlot(n)?'Игра сохранена в слот '+n+'.':'Не удалось сохранить: нет места в браузере.')};
    h['l'+n]=()=>{if(loadSlot(n))begin(false);else showMenu('Не удалось загрузить слот.')};
  });
  html+=`<div class="btns" style="flex-direction:column;align-items:stretch;margin-top:10px"><button class="btn" data-m="stats">Итоги кампании</button><button class="btn" data-m="snd">Звук: ${SND.on?'включён':'выключен'}</button><button class="btn" data-m="new">Новая игра</button><button class="btn primary" data-m="ok">Закрыть</button></div>`;
  h.stats=()=>showStats(showMenu);
  h.snd=()=>{SND.on=!SND.on;try{localStorage.setItem('chron_snd',SND.on?'1':'0')}catch(e){}if(SND.on){actx();snd('bell')}showMenu()};
  h.new=()=>showStart();
  h.ok=closeModal;
  openModal(html,h);
}

/* --- итоги кампании --- */
function chartSVG(series,w,hh){
  const n=Math.max(...series.map(s=>s.v.length));
  if(n<2)return '<p class="mut">График появится после нескольких ходов.</p>';
  const mx=Math.max(1,...series.flatMap(s=>s.v));
  const px=i=>(8+i*(w-16)/(n-1)).toFixed(1),py=v=>(hh-8-(v/mx)*(hh-20)).toFixed(1);
  let s=`<svg viewBox="0 0 ${w} ${hh}" width="100%" role="img"><rect width="${w}" height="${hh}" rx="8" fill="#0f161d"/>`;
  [0,.5,1].forEach(f=>{s+=`<line x1="8" x2="${w-8}" y1="${py(mx*f)}" y2="${py(mx*f)}" stroke="#fff" stroke-opacity=".08"/>`});
  series.forEach(se=>{s+=`<polyline fill="none" stroke="${se.c}" stroke-width="2" points="${se.v.map((v,i)=>px(i)+','+py(v)).join(' ')}"/>`});
  return s+`<text x="10" y="13" font-size="10" fill="#9aa7b4">макс. ${mx}</text></svg>`;
}
function hallList(){
  const me=S.player;
  return Object.values(S.gens).filter(g=>g.f===me).map(g=>({g,sc:g.w*2+g.cap*3+(g.hero?4:0)})).sort((a,b)=>b.sc-a.sc).slice(0,6);
}

  <div class="kv"><div><small>Провинций</small><b class="num">${own1.length}</b></div><div><small>Битв выиграно</small><b class="num">${st.bw}</b></div><div><small>Битв проиграно</small><b class="num">${st.bl}</b></div><div><small>Городов взято</small><b class="num">${st.cap}</b></div><div><small>Городов потеряно</small><b class="num">${st.lost}</b></div><div><small>Вассалов</small><b class="num">${vassalsOf(me).length}</b></div></div>

  <small>Число провинций: <span style="color:var(--brass)">вы</span> и сильнейший соперник</small>${chartSVG([{c:'#6b7a89',v:hs.map(x=>x.r)},{c:'#e0b83a',v:hs.map(x=>x.p)}],340,110)}
  <small style="margin-top:8px;display:block">Военная сила</small>${chartSVG([{c:'#e05a4a',v:hs.map(x=>x.s)}],340,90)}
  <h3 style="margin:12px 0 4px">Зал славы</h3>`;
  const hall=hallList();
  html+=hall.length?hall.map(({g})=>`<button class="grow" data-m="g_${g.id}">${portraitSVG(g,36)}<span><b>${gFullName(g)}</b><br><span class="mut" style="display:inline">Побед ${g.w} · городов ${g.cap} · ${g.dead?'погиб в '+g.dead+' г.':'жив'}</span></span></button>`).join(''):'<p class="mut">Пока ни один полководец не прославился.</p>';
  hall.forEach(({g})=>h['g_'+g.id]=()=>{showGen(g.id)});
  html+=`<div class="btns"><button class="btn primary" data-m="ok">${back?'Назад':'Закрыть'}</button></div>`;
  openModal(html,h);
}

/* --- дипломатия: расширенные действия --- */
function showDip(g,msg){
  const me=S.player,h={},k=pk(me,g),war=atWar(me,g);
  const r=strength(me)/Math.max(strength(g),1);
  let html=`<small>Дипломатия</small><h2>${dot(g)} ${FAC[g].n}</h2><p class="mut">${RG[rgOf(g)]} · сила ${fmt(strength(g))} против вашей ${fmt(strength(me))}${S.vas[g]===me?' · ваш вассал':S.vas[g]?' · вассал «'+fname(S.vas[g])+'»':''}</p>${msg?`<p style="color:var(--brass)">${msg}</p>`:''}`;
  const A=[];
  A.push(['trade',S.trade[k]?'Расторгнуть торговый договор':'Торговый договор',war?'Нельзя во время войны':'+6% к доходу обеих держав (до 3 договоров)',war&&!S.trade[k],()=>offerTrade(g)]);
  A.push(['vas','Потребовать вассалитета','Вассал платит четверть дохода. Нужен большой перевес сил'+(war?' (идёт война: хватит 1,6 раза)':' (3 раза)'),!!S.vas[g]||isAlly(me,g),()=>demandVassal(g)]);
  const dg=S.dyn[g];
  if(dg.regency>0&&dg.cands&&!war)dg.cands.forEach((c,ix)=>A.push(['cl'+ix,'Поддержать: '+c.name+' · 200','Претендент, '+c.tr.map(x=>RT[x].n).join(', ')+'. Победа даст отношения +25',S.gold[me]<200||(S.sup&&S.sup[g]!==undefined),()=>supportClaimant(g,ix)]));
  A.push(['prov','Потребовать город','Слабая держава может уступить приграничный город. Нужен перевес в 2,2 раза',isAlly(me,g),()=>demandProv(g)]);
  if(rgOf(me)!==rgOf(g))A.push(['holy','Священная война · 100','Война за веру: 8 ходов войска +8%, лояльность +4 у обеих сторон',S.gold[me]<100,()=>holyWarPlayer(g)]);
  A.forEach(([id,t,d,dis,fn])=>{
    html+=`<button class="btn unit" style="width:100%;margin:4px 0" data-m="${id}" ${dis?'disabled':''}><b>${t}</b><span>${d}</span></button>`;
    h[id]=()=>{const m=fn();refreshAll();saveGame();showDip(g,m)};
  });
  html+=`<h3 style="margin:10px 0 2px">Шпионы</h3><p class="mut">Одна операция в год. Провал портит отношения.</p>`;
  SPY.forEach(m=>{
    const dis=S.spy===S.turn||S.gold[me]<m.cost||isAlly(me,g);
    html+=`<button class="btn unit" style="width:100%;margin:4px 0" data-m="sp_${m.id}" ${dis?'disabled':''}><b>${m.n} · ${m.cost}</b><span>${m.d}. Шанс около ${Math.round(m.p*100)}%</span></button>`;
    h['sp_'+m.id]=()=>{const t=spyDo(g,m.id);refreshAll();saveGame();showDip(g,t)};
  });
  html+=`<div class="btns"><button class="btn primary" data-m="ok">Закрыть</button></div>`;
  h.ok=closeModal;
  openModal(html,h);
}

function facExtra(g){
  const me=S.player,a=[];
  if(S.trade[pk(me,g)])a.push('торговля');
  if(S.vas[g]===me)a.push('ваш вассал');else if(S.vas[g])a.push('вассал');

/* ===== ГОРЫ, РЕКИ И ОЗЁРА НА КАРТЕ ===== */
function smoothPath(pts,closed){
  const f=v=>v.toFixed(1);
  if(closed){
    const n=pts.length;let d='';
    for(let i=0;i<n;i++){const a=pts[i],b=pts[(i+1)%n],mx=(a[0]+b[0])/2,my=(a[1]+b[1])/2;
      if(i===0)d+=`M${f((pts[n-1][0]+a[0])/2)},${f((pts[n-1][1]+a[1])/2)}`;
      d+=`Q${f(a[0])},${f(a[1])} ${f(mx)},${f(my)}`}
    return d+'Z';
  }
  if(pts.length<3)return 'M'+pts.map(p=>f(p[0])+','+f(p[1])).join('L');
  let d=`M${f(pts[0][0])},${f(pts[0][1])}`;
  for(let i=1;i<pts.length-1;i++){
    const mx=(pts[i][0]+pts[i+1][0])/2,my=(pts[i][1]+pts[i+1][1])/2;
    d+=`Q${f(pts[i][0])},${f(pts[i][1])} ${f(mx)},${f(my)}`;
  }
  const l=pts[pts.length-1];
  return d+`L${f(l[0])},${f(l[1])}`;
}
const plen=p=>{let t=0;for(let i=1;i<p.length;i++)t+=Math.hypot(p[i][0]-p[i-1][0],p[i][1]-p[i-1][1]);return t};
function meander(p,rn){
  const out=[p[0]];
  for(let i=1;i<p.length;i++){
    const [x1,y1]=p[i-1],[x2,y2]=p[i],L=Math.hypot(x2-x1,y2-y1),nx=-(y2-y1)/L,ny=(x2-x1)/L,k=Math.max(1,Math.round(L/16));
    for(let j=1;j<=k;j++){const t=j/k,o=j<k?(rn()-.5)*Math.min(5,L/5):0;out.push([x1+(x2-x1)*t+nx*o,y1+(y2-y1)*t+ny*o])}
  }
  return out;
}
function geoFeatures(){
  const rn=mulberry(77);
  let h='<g id="geo" pointer-events="none">';
  // реки: тонкие, извилистые, тёмный приглушённый тон под границами
  RIVERS.forEach(([n,pts])=>{
    const p=meander(pts.map(([lo,la])=>proj(lo,la)),rn),half=Math.floor(p.length*.55);
    h+=`<g clip-path="url(#landclip)" opacity=".8"><path d="${smoothPath(p.slice(0,half+1))}" fill="none" stroke="#3e7ea3" stroke-width="1" stroke-linecap="round" vector-effect="non-scaling-stroke"/><path d="${smoothPath(p.slice(half))}" fill="none" stroke="#3e7ea3" stroke-width="1.8" stroke-linecap="round" vector-effect="non-scaling-stroke"/></g>`;
  });
  // озёра: неправильные контуры, обрезаны границей своей области
  LAKES.forEach(([n,lo,la,rx,ry])=>{
    const [x0,y0]=proj(lo,la);if(!landOf([x0,y0]))return;
    const i=nearestProv(x0,y0),x=x0+(GEO.pts[i][0]-x0)*.4,y=y0+(GEO.pts[i][1]-y0)*.4,rot=(LAKE_ROT[n]||0)*Math.PI/180,N=12,pts=[];
    const a=rx*PXL*.8,b=ry*PYL*.8;
    for(let k=0;k<N;k++){const t=k/N*Math.PI*2,r=.82+rn()*.36,px=Math.cos(t)*a*r,py=Math.sin(t)*b*r;
      pts.push([x+px*Math.cos(rot)-py*Math.sin(rot),y+px*Math.sin(rot)+py*Math.cos(rot)])}
    h+=`<g clip-path="url(#c-${GEO.lm[i]})"><path d="${smoothPath(pts,true)}" clip-path="url(#cc-${i})" fill="#244f6c" stroke="#5f9cc0" stroke-width="1" stroke-opacity=".7" vector-effect="non-scaling-stroke"/></g>`;
  });
  // горы: приглушённые, сливаются с фоном
  RANGES.forEach(([n,pts,sc])=>{
    const p=pts.map(([lo,la])=>proj(lo,la)),items=[];
    for(let i=0;i<p.length-1;i++){
      const [x1,y1]=p[i],[x2,y2]=p[i+1],L=Math.hypot(x2-x1,y2-y1),k=Math.max(1,Math.round(L/10));
      for(let j=0;j<k;j++){const t=(j+rn()*.6)/k,nx=-(y2-y1)/L,ny=(x2-x1)/L,off=(rn()-.5)*6;items.push([x1+(x2-x1)*t+nx*off,y1+(y2-y1)*t+ny*off])}
    }
    h+=`<g opacity=".62" clip-path="url(#landclip)">`;
    items.sort((a,b)=>a[1]-b[1]).forEach(([x,y])=>{
      if(!landOf([x,y]))return;
      if(GEO.pts.some(c=>Math.hypot(c[0]-x,c[1]-y)<13))return;
      const s=(3.6+rn()*2.4)*sc,f=v=>v.toFixed(1);
      h+=`<path d="M${f(x-s)},${f(y+s*.5)}L${f(x)},${f(y-s)}L${f(x+s*.15)},${f(y+s*.5)}Z" fill="rgba(215,222,228,.4)"/><path d="M${f(x)},${f(y-s)}L${f(x+s)},${f(y+s*.5)}L${f(x+s*.15)},${f(y+s*.5)}Z" fill="rgba(18,26,34,.55)"/>`;
    });
    h+='</g>';
  });
  h+='</g>';
  // границы областей поверх рек и озёр
  h+='<g id="borders" pointer-events="none">'+PR.map((p,i)=>`<g clip-path="url(#c-${GEO.lm[i]})"><path d="${GEO.cells[i]}" fill="none" stroke="#0d1a24" stroke-width="1" vector-effect="non-scaling-stroke"/></g>`).join('')+'</g>';
  return h;
}
/* подписи: поверх всего, видны при приближении */
function geoLabels(){
  let h='<g id="geolbl" class="geolbl" pointer-events="none"><defs>';
  const items=[];
  const orient=p=>p[p.length-1][0]<p[0][0]?p.slice().reverse():p;
  RIVERS.forEach(([n,pts],i)=>{
    const p=orient(pts.map(([lo,la])=>proj(lo,la)));
    if(plen(p)<n.length*7)return;
    h+=`<path id="gr${i}" d="${smoothPath(p)}"/>`;
    items.push(`<text class="gt rv"><textPath href="#gr${i}" startOffset="50%" text-anchor="middle">${n}</textPath></text>`);
  });
  RANGES.forEach(([n,pts,sc],i)=>{
    const p=orient(pts.map(([lo,la])=>proj(lo,la)));
    if(plen(p)<n.length*9)return;
    h+=`<path id="gm${i}" d="${smoothPath(p)}"/>`;
    items.push(`<text class="gt mt"><textPath href="#gm${i}" startOffset="50%" text-anchor="middle">${n.toUpperCase()}</textPath></text>`);
  });
  h+='</defs>'+items.join('');
  LAKES.forEach(([n,lo,la,rx,ry])=>{
    const [x0,y0]=proj(lo,la);if(!landOf([x0,y0])||rx<.4)return;
    const i=nearestProv(x0,y0),x=x0+(GEO.pts[i][0]-x0)*.4,y=y0+(GEO.pts[i][1]-y0)*.4;
    h+=`<text class="gt lk" x="${x.toFixed(1)}" y="${y.toFixed(1)}" text-anchor="middle">${n}</text>`;
  });
  return h+'</g>';

/* --- действия --- */
function toast(t){const h=$('hint');h.hidden=false;h.textContent=t;setTimeout(()=>{if(h.textContent===t)refreshMap()},2600)}
function onAct(a,d){
  const me=S.player;
  if(a==='gen'){showGen(d.id);return}
  if(a==='rec'){const e=recruit(UI.sel,d.t);if(e)toast(e)}
  else if(a==='sub'){UI.sub=d.s;renderSheet();return}
  else if(a==='bld'){const e=build(UI.sel,d.id);if(e)toast(e)}
  else if(a==='ship'){const e=buildShip(UI.sel);if(e)toast(e)}
  else if(a==='up'){const e=upgrade(UI.sel);if(e)toast(e)}
  else if(a==='move'){animMove(+d.from,+d.to,fcol(me));moveArmy(+d.from,+d.to);UI.sel=+d.to;const ls=S.prov[+d.to].army&&S.prov[+d.to].army.loss;if(ls)toast('Переход через горы: потеряно бойцов — '+ls)}
  else if(a==='atk'){UI.tact=null;showPreBattle(+d.from,+d.to);return}
  else if(a==='war'){
    const key='war'+d.f;
    if(UI.confirm!==key){UI.confirm=key;renderSheet();return}
    UI.confirm=null;declareWar(me,d.f);
  }
  refreshAll();saveGame();
}
function doAttack(from,to,tact){
  const rep=attack(from,to,tact);S.notes=[];
  S.pending=S.pending.filter(r=>r!==rep);
  UI.sel=to;refreshAll();saveGame();
  showBattle(rep,()=>{closeModal();refreshAll()});
}

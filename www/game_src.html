function runQueue(q){
  const step=()=>{const f=q.shift();if(!f){closeModal();refreshAll();return}f(step)};
  step();
}
function eventWindow(done){
  const ev=EVENTS.find(e=>e.id===S.event);
  if(!ev)return done();
  const g=S.gold[S.player];
  openModal(`<small>Событие при дворе</small><div class="evh">${evIcon(ev.id,48)}<h2>${ev.t}</h2></div><p>${ev.x}</p><div class="btns" style="flex-direction:column;align-items:stretch">`+
   ev.c.map((c,k)=>`<button class="btn" data-m="c${k}" ${g<c.cost?'disabled':''}>${c.t}${c.cost?' · '+c.cost+' золота':''}</button>`).join('')+`</div>`,
   Object.fromEntries(ev.c.map((c,k)=>['c'+k,()=>{const r=resolveEvent(ev.id,k);refreshAll();openModal(`<h2>${ev.t}</h2><p>${r}</p><div class="btns"><button class="btn primary" data-m="ok">Хорошо</button></div>`,{ok:done})}])));
}
function endWindow(kind,done){
  const n=own(S.player).length;
  const key=kind+'Shown';S.flags[key]=true;saveGame();
  if(kind==='lost')return openModal(`<h2 style="color:var(--bad)">Династия пала</h2><p>У вас не осталось ни одной провинции. Хроника заканчивается на ${S.year} годе.</p><div class="btns"><button class="btn primary" data-m="new">Начать заново</button><button class="btn" data-m="st">Итоги</button></div>`,{new:()=>{clearSave();showStart()},st:()=>showStats(()=>endWindow('lost',done))});
  if(kind==='won')return openModal(`<h2 style="color:var(--good)">Победа!</h2><p>${FAC[S.player].n} владеет ${n} провинциями в ${S.year} году. Европа склонилась перед вами.</p><div class="btns"><button class="btn primary" data-m="go">Играть дальше</button><button class="btn" data-m="new">Новая игра</button><button class="btn" data-m="st">Итоги</button></div>`,{go:done,new:()=>{clearSave();showStart()},st:()=>showStats(()=>endWindow('won',done))});
  openModal(`<h2>Эпоха закончилась</h2><p>Наступил ${S.year} год, а вы владеете ${n} из ${WIN_AT} нужных провинций. Можно продолжить игру и всё же победить.</p><div class="btns"><button class="btn primary" data-m="go">Продолжить</button><button class="btn" data-m="new">Новая игра</button><button class="btn" data-m="st">Итоги</button></div>`,{go:done,new:()=>{clearSave();showStart()},st:()=>showStats(()=>endWindow('timeup',done))});
}
function afterTurn(){
  refreshAll();
  const q=[];
  S.pending.forEach(r=>q.push(d=>showBattle(r,d)));
  S.pending=[];
  q.push(newsWindow);
  (S.hq||[]).forEach(id=>q.push(histWindow(id)));S.hq=[];
  S.techNews.forEach(id=>q.push(d=>openModal(`<small>Исследование завершено</small><h2>${TECH[id].n}</h2><p>${TECH[id].d}.</p><div class="btns"><button class="btn primary" data-m="ok">Отлично</button></div>`,{ok:d})));
  S.techNews=[];
  S.notes.forEach(n=>q.push(d=>openModal(`<small>Весть из армии</small><h2>${n.t}</h2><p>${n.x}</p><div class="btns"><button class="btn primary" data-m="ok">Понятно</button></div>`,{ok:d})));
  S.notes=[];
  if(S.event)q.push(eventWindow);
  if(S.pc)q.push(pcWindow);
  if(S.cq)q.push(cqWindow);
  if(S.pOffer)q.push(pOfferWindow);
  if(S.ult)q.push(ultWindow);
  if(S.flags.lost&&!S.flags.lostShown)q.push(d=>endWindow('lost',d));
  if(S.flags.won&&!S.flags.wonShown)q.push(d=>endWindow('won',d));
  if(S.flags.timeup&&!S.flags.timeupShown)q.push(d=>endWindow('timeup',d));
  if(UI.sel!==null&&!S.prov[UI.sel])UI.sel=null;
  runQueue(q);
}

$('endturn').onclick=()=>{

    (S.mar&&S.mar[pk(me,g)]?'<span class="chip">Родственные узы</span>':(!war&&!canWed(g)?`<button class="btn small" data-c="wed" data-f="${g}" ${S.gold[me]<200?'disabled':''}>Брак · 200</button>`:''))+
    `<button class="btn small" data-c="more" data-f="${g}">Ещё…</button>`+
    (war?`<button class="btn small" data-c="peace" data-f="${g}">Предложить мир</button>`
    :`<button class="btn small" data-c="gift" data-f="${g}" ${S.gold[me]<100?'disabled':''}>Подарок 100</button>`+
      (ally?`<button class="btn small" data-c="brk" data-f="${g}">Разорвать союз</button>`:`<button class="btn small" data-c="ally" data-f="${g}">Предложить союз</button>`)+
      `<button class="btn small danger" data-c="dwar" data-f="${g}">${UI.confirm===wk?'Точно? Нажмите ещё раз':'Объявить войну'}</button>`)+
    (war?`<button class="btn small" data-c="gift" data-f="${g}" ${S.gold[me]<100?'disabled':''}>Подарок 100</button>`:'')+`</div></div>`;
  });

$('court').addEventListener('click',e=>{
  const b=e.target.closest('[data-c]');if(!b||b.disabled||!S)return;
  const me=S.player,c=b.dataset.c,g=b.dataset.f;
  if(c==='cgift'){courtGift(b.dataset.k);refreshAll();saveGame();return}
  if(c==='gen'){showGen(b.dataset.id);return}
  if(c==='hire'){const er=hireGen(me,capIdx(me));UI.hmsg=er||'Полководец прибыл в столицу.';refreshAll();saveGame();return}
  if(c==='tax'){S.tax[me]=b.dataset.k}
  else if(c==='peace'){UI.msg[g]=offerPeace(g)?'Мир заключён.':'Предложение отвергнуто.'}
  else if(c==='ally'){UI.msg[g]=offerAlliance(g)?'Союз заключён.':(relOf(me,g)<40?'Им нужно больше доверия. Подарки и мирные годы помогут.':'Они отказались.')}
  else if(c==='more'){showDip(g);return}
  else if(c==='wed'){UI.msg[g]=wed(g)}
  else if(c==='gift'){giftTo(g);UI.msg[g]='Подарок принят. Отношения лучше.'}
  else if(c==='brk'){breakAlliance(g);UI.msg[g]='Союз разорван.'}
  else if(c==='dwar'){
    const k='dw'+g;
    if(UI.confirm!==k){UI.confirm=k;renderCourt();return}
    UI.confirm=null;declareWar(me,g);UI.msg[g]='';
  }
  refreshAll();saveGame();
});

  const me=S.player,cur=S.res.cur[me];
  let h=`<h2>Исследования</h2>`;
  if(cur){const t=TECH[cur.id];h+=`<div class="tcard cur"><b>Сейчас изучается: ${t.n}</b><div class="chip">${t.d}</div><div class="bar"><i style="width:${Math.round((1-cur.left/t.t)*100)}%;background:var(--brass)"></i></div><div class="chip">Осталось ходов: ${cur.left}</div></div>`}
  else h+=`<p class="chip">Учёные свободны. Выберите, что изучать: одновременно идёт одно исследование.</p>`;
  h+=`<h2>Уникальные: ${FAC[me].n}</h2><div class="tgrid2">`+UNIQ[me].map(u=>techCard(u[0],me)).join('')+`</div>`;
  [['mil','Военное дело'],['eco','Экономика'],['gov','Управление']].forEach(([b,n])=>{
    h+=`<h2>${n}</h2><div class="tgrid2">`+COMMON_T.filter(id=>TECH[id].b===b).map(id=>techCard(id,me)).join('')+`</div>`;
  });
  el.innerHTML=h;
}
$('techpage').addEventListener('click',e=>{

/* --- правила и старт --- */
function renderHelp(){
  $('help').innerHTML=`<h2>Как победить</h2><p>Владейте ${WIN_AT} провинциями до ${END_YEAR} года. Один ход равен одному году. На карте 17 держав и независимые земли. Рядом с каждым городом стоит герб державы, которой он принадлежит, а серый щит с башней означает независимые земли.</p>
  <h2>Что делать в ход</h2>
  <p><b>1.</b> Нажмите на свой город и наймите войска, они стоят золота.</p>
  <p><b>2.</b> Нажмите на город с армией. Соседние провинции подсветятся пунктиром.</p>
  <p><b>3.</b> Нажмите на соседнюю провинцию. Свою можно занять армией, чужую нужно атаковать. Приложение подскажет шансы.</p>
  <p><b>4.</b> Нажмите «Конец хода». Соперники сделают свои ходы.</p>
  <h2>Войска</h2>
  <p>Они сильны друг против друга по кругу: копейщики бьют рыцарей, рыцари бьют лучников, лучники бьют копейщиков. Смешанное войско надёжнее. Рыцари дорогие и сильные.</p>
  <p>Кроме них есть мечники, арбалетчики и конные сержанты. А у каждой страны есть свой особый отряд со звёздочкой ★, например длинный лук у Англии, гусары у Польши, мамлюки у Египта. Каждый особый отряд относится к одному из трёх родов войск и бьётся по тому же кругу, но сильнее и крепче обычных. Для найма нужна подходящая постройка: казармы, стрельбище или конюшни.</p>
  <p>Защитникам помогают стены: чем больше город, тем крепче оборона. Столица ещё крепче. Каждая армия ходит один раз в ход и на одну провинцию.</p>
  <h2>Рельеф карты</h2>
  <p>Реки, горы и озёра влияют на бой. Нападение через реку даёт защитнику +15%, через горный хребет +20%, а армия при переходе через хребет теряет около 5% бойцов. Город у озера лучше обороняется (+8%). Города на реках и озёрах приносят больше дохода. Всё это показано перед боем и в карточке города.</p>
  <h2>Осады и флот</h2>
  <p>Крупный город или город со стенами можно не штурмовать сразу, а <b>осадить</b>: армия остаётся рядом, а гарнизон слабеет каждый ход. Через два хода стены уже не помогают, а город может сдаться без боя. Долгая осада вредит и вашим войскам.</p>
  <p>Между землями через море армия идёт только на <b>корабле</b>. Его строят в порту (город с морским путём), он плывёт вместе с армией. Проигранный бой на море означает потерю корабля. Соперники пользуются морем без этих ограничений.</p>
  <h2>Дипломатия: больше возможностей</h2>
  <p>Кнопка «Ещё…» у каждой державы во вкладке «Двор» открывает торговые договоры (+6% дохода), требование вассалитета (вассал платит четверть дохода), требование города у слабого соседа, священную войну и шпионов: саботаж, подкуп гарнизона, убийство полководца и правителя. Провал операции портит отношения. Иногда сильный сосед сам требует дань, и отказ означает войну.</p>
  <h2>Вера</h2>
  <p>У каждой державы своя вера: католичество, православие, ислам или тенгрианство. В городах чужой веры лояльность ниже, а храм смягчает это и помогает обращению. Священная война даёт 8 ходов бонуса войскам и лояльности обеим сторонам.</p>
  <h2>Меню и итоги</h2>
  <p>Кнопка «Меню» на карте открывает три слота сохранения, итоги кампании с графиками, зал славы полководцев и включение звука. Звуки создаются в самом браузере и начинаются после первого нажатия.</p>
  <h2>Династия</h2>
  <p>Характер правителя влияет на политику: воинственный чаще начинает войны, миролюбивый ищет мира. Новый правитель может расторгнуть договоры, прекратить войну и предложить вам мир. Если наследника нет, начинается смута: города отпадают, двор делится между двумя претендентами. Чужого претендента можно поддержать золотом в окне дипломатии, а государство в смуте слабее в обороне. Можно также убить наследника или претендента руками шпионов, но убийство может раскрыться и привести к войне.</p>
  <h2>Сословия</h2>
  <p>Знать, духовенство, купцы и войско оценивают ваши решения. Довольные дают бонусы, недовольные вредят, а при совсем низком настроении устроят бунт. Их можно задобрить дарами во вкладке «Двор».</p>
  <p>У вашей страны есть правитель с чертами характера и наследник. Когда правитель умирает, престол переходит к наследнику со своими чертами. Без наследника страна впадает в смуту. Династический брак с другой державой даёт приданое и мир с ней.</p>
  <h2>Города и деньги</h2>
  <p>Доход приносят города. Улучшайте их: большой город даёт в пять раз больше деревни. Размер виден на карте по модели города. Войска стоят золота каждый ход, поэтому смотрите на строку «за ход» вверху. Если казна уйдёт в минус, солдаты разбегутся.</p>
  <h2>Сражения</h2>
  <p>Когда вы нападаете, открывается поле боя. Выберите тактику: каждая усиливает один род войск и ослабляет другой. Приложение даёт совет и показывает шансы. Бой идёт до пяти раундов, армия, потерявшая больше двух третей сил, бежит. Лес и горы мешают коннице, а горы ещё и помогают защитнику.</p>
  <h2>Исследования</h2>
  <p>На вкладке «Науки» можно изучать одну технологию за раз. Они стоят золота и занимают несколько ходов. Общие улучшения доступны всем, а у каждой державы есть свои уникальные: например, у Англии длинный лук, у Польши крылатые гусары.</p>
  <h2>Полководцы</h2>
  <p>У каждого полководца есть биография, характеристики и черты. Он ведёт армию в своём городе и идёт вместе с ней. Командование усиливает войско, тактика делает приёмы сильнее, управление повышает доход и лояльность города. В боях полководцы набирают опыт, получают звания и черты, но могут быть ранены или погибнуть. Новых можно нанять на вкладке «Двор».</p>
  <h2>Постройки</h2>
  <p>В каждом городе есть места под здания: чем больше город, тем их больше. Рынок даёт доход, казармы ускоряют набор, храм успокаивает народ, стены укрепляют оборону. Лучников можно нанимать только при Стрельбище, а рыцарей только при Конюшнях. Стройка идёт один-два хода, в городе строится одно здание за раз.</p>
  <h2>Политика</h2>
  <p>Лояльность показывает, как народ относится к вам. Высокие налоги дают золото, но злят людей. Захваченный город сначала недоволен: оставьте в нём армию.</p>
  <p>На вкладке «Двор» можно предложить мир, заключить союз, сделать подарок или объявить войну. Союзники дают прибавку к доходу. Независимые земли можно атаковать в любой момент.</p>
  <h2>Совет новичку</h2>
  <p>Сначала возьмите слабые независимые земли рядом. Не оставляйте столицу без армии и держите казну положительной.</p>
  <div class="btns" style="margin-top:16px"><button class="btn danger" id="newgame">Начать новую игру</button></div>`;
  let sure=false;
  $('newgame').onclick=function(){if(!sure){sure=true;this.textContent='Точно? Прогресс пропадёт. Нажмите ещё раз';return}clearSave();showStart()};
}
let chosenDiff=1;
function showStart(){
  let h=`<h2>Хроники Европы</h2><p>Пошаговая стратегия о средневековой Европе. Выберите державу и начните правление в ${START_YEAR} году.</p>`;
  if(hasSave())h+=`<div class="btns" style="margin-top:8px"><button class="btn primary" data-m="load">Продолжить сохранённую игру</button></div>`;
  h+=`<div class="row" style="margin-top:12px"><small>Сложность</small>`+['Лёгкая','Обычная','Трудная'].map((n,k)=>`<button class="btn small ${k===chosenDiff?'primary':''}" data-m="d${k}">${n}</button>`).join('')+`</div><div class="fgrid">`+
   FK.slice().sort((a,b)=>['Легко','Средне','Сложно'].indexOf(FAC[a].lvl)-['Легко','Средне','Сложно'].indexOf(FAC[b].lvl)).map(f=>`<button class="fcard" data-m="p_${f}"><b>${crestSVG(f,22)} ${FAC[f].n}</b><span>${FAC[f].d}</span><em>${FAC[f].lvl} · ${own0(f)} провинций</em></button>`).join('')+`</div>`;
  const hs={load:()=>{if(loadGame()){begin(false)}else showStart()}};
  [0,1,2].forEach(k=>hs['d'+k]=()=>{chosenDiff=k;showStart()});
  FK.forEach(f=>hs['p_'+f]=()=>{newGame(f,chosenDiff);begin(true)});
  openModal(h,hs);
}
const own0=f=>PR.filter(p=>p[4]===f).length;
function begin(fresh){
  closeModal();UI.sel=null;UI.msg={};UI.confirm=null;
  refreshAll();renderHelp();
  const c=capIdx(S.player);
  requestAnimationFrame(()=>{measure();if(c>=0)focusOn(c,.9);refreshMap();
    if(!fresh&&S.event)afterTurn();
    if(fresh&&!S.flags.tut)showTutorial(0)});
  setTab('map');
  if(S.flags.lost&&!S.flags.lostShown)afterTurn();
}
function setTab(t){
  UI.tab=t;
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===t));
  document.querySelectorAll('.view').forEach(v=>v.classList.toggle('on',v.id==='v-'+t));
  if(t==='map')requestAnimationFrame(()=>{measure();applyView()});
  if(t==='court')renderCourt();
  if(t==='tech')renderTech();
}
document.getElementById('tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(b)setTab(b.dataset.tab)});

   +(el?`<div class="mut" style="margin-top:6px">Здесь правитель избирается, наследников нет. Когда он умрёт, выберут нового.</div>`
   :h?`<div class="row" style="flex-wrap:nowrap;align-items:center;gap:10px;margin-top:8px">${portraitSVG({...h,f:me,seed:hashS(h.name+h.born)},40)}<div class="mut">Наследник: <b>${h.name}</b>, ${rAge(h)<1?'младенец':rAge(h)+' лет'}<br>${trs(h.tr)}</div></div>`:`<div class="mut" style="margin-top:6px">Наследника пока нет. Без него смерть правителя ввергнет страну в смуту.</div>`)
   +`<p class="mut" style="margin:6px 0 0">Брак с другой державой даёт приданое и мир с ней. Кнопка «Брак» у государства ниже.</p></div>`;

function hashS(s){let h=7;for(const c of String(s))h=(h*31+c.charCodeAt(0))|0;return Math.abs(h)}
